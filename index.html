<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Phira Web Player</title>
  <!-- JSZip CDN for in-memory zip decompression -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* UI Overlay: File Loader */
    #loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b212f, #050608);
      z-index: 100;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px 40px;
      border-radius: 12px;
      backdrop-filter: blur(16px);
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #79c0ff;
    }
    .desc {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .file-btn {
      display: inline-block;
      position: relative;
      background: #238636;
      color: #fff;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      overflow: hidden;
    }
    .file-btn:hover {
      background: #2ea043;
    }
    .file-btn input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #status-msg {
      margin-top: 15px;
      font-size: 13px;
      color: #58a6ff;
      min-height: 18px;
    }
    /* Settlement Modal */
    #settle-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .settle-box {
      width: 80%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .rank-text {
      font-size: 96px;
      font-weight: 900;
      margin: 10px 0;
      letter-spacing: 4px;
      color: #e3b341;
      text-shadow: 0 0 20px rgba(227, 179, 65, 0.5);
    }
    .score-detail {
      width: 100%;
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 0;
      font-size: 15px;
    }
    .action-btn {
      margin-top: 25px;
      background: #30363d;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 10px 28px;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .action-btn:hover {
      background: #38404a;
    }
  </style>
</head>
<body>

  <!-- Loading & File Selection Screen -->
  <div id="loader-overlay">
    <div class="card">
      <div class="title">PHIRA WEB CORE</div>
      <div class="desc">Upload official or community Phira/Phigros chart pack (<code>.zip</code> format containing chart JSON, audio, and background).</div>
      <label class="file-btn">
        Select Chart .zip
        <input type="file" id="zip-input" accept=".zip" />
      </label>
      <div id="status-msg"></div>
    </div>
  </div>

  <!-- Game Settlement (Result) Screen -->
  <div id="settle-overlay">
    <div class="settle-box">
      <div style="font-size: 20px; letter-spacing: 2px; color: #8b949e;">STAGE CLEAR</div>
      <div class="rank-text" id="res-grade">φ</div>
      <div style="font-size: 36px; font-weight: 700; margin-bottom: 10px;" id="res-score">1000000</div>
      <div class="score-detail">
        <div class="stat-row"><span>Perfect</span><span id="res-perf" style="color: #ffe57f;">0</span></div>
        <div class="stat-row"><span>Good</span><span id="res-good" style="color: #80d8ff;">0</span></div>
        <div class="stat-row"><span>Bad</span><span id="res-bad" style="color: #ff5252;">0</span></div>
        <div class="stat-row"><span>Miss</span><span id="res-miss" style="color: #9e9e9e;">0</span></div>
        <div class="stat-row"><span>Max Combo</span><span id="res-combo">0</span></div>
        <div class="stat-row"><span>Accuracy</span><span id="res-acc">100.00%</span></div>
      </div>
      <button class="action-btn" onclick="location.reload()">Load Another Chart</button>
    </div>
  </div>

  <!-- Render Canvas -->
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <script>
    /**
     * PHIRA / PHIGROS SIMULATOR ENGINE CORE
     * Standard implementation matching formatVersion 3
     */

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Web Audio State
    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;
    let audioStartTime = 0;
    let isPlaying = false;
    let songDuration = 0;

    // Game Chart Data
    let chartData = null;
    let bgImage = new Image();
    let bgLoaded = false;

    // Gameplay Metrics & Counters
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let perfectCount = 0;
    let goodCount = 0;
    let badCount = 0;
    let missCount = 0;
    let totalNotes = 0;

    // Judge Timings (seconds)
    const JUDGE_PERFECT = 0.08;
    const JUDGE_GOOD = 0.16;
    const JUDGE_BAD = 0.20;

    // Interactive Touch Tracking
    const activeTouches = new Map();

    function setStatus(text) {
      document.getElementById('status-msg').innerText = text;
    }

    // Zip File Upload and Extraction
    document.getElementById('zip-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      setStatus('Extracting chart bundle...');
      try {
        const zip = await JSZip.loadAsync(file);
        let chartFile = null;
        let audioFile = null;
        let imageFile = null;

        // Traverse archive files
        for (const [relativePath, zipEntry] of Object.entries(zip.files)) {
          if (zipEntry.dir) continue;
          const lower = relativePath.toLowerCase();
          if (lower.endsWith('.json') || lower.endsWith('.csv') || lower.endsWith('.txt')) {
            if (!chartFile || lower.includes('chart')) chartFile = zipEntry;
          } else if (lower.endsWith('.mp3') || lower.endsWith('.ogg') || lower.endsWith('.wav')) {
            audioFile = zipEntry;
          } else if (lower.endsWith('.jpg') || lower.endsWith('.png') || lower.endsWith('.jpeg')) {
            imageFile = zipEntry;
          }
        }

        if (!chartFile || !audioFile) {
          throw new Error('Missing chart JSON or audio stream inside archive.');
        }

        // 1. Parse Chart JSON
        setStatus('Parsing chart data...');
        const chartJsonStr = await chartFile.async('string');
        chartData = JSON.parse(chartJsonStr);
        preprocessChart(chartData);

        // 2. Decode Audio
        setStatus('Decoding audio assets...');
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioData = await audioFile.async('arraybuffer');
        audioBuffer = await audioCtx.decodeAudioData(audioData);
        songDuration = audioBuffer.duration;

        // 3. Load Background
        if (imageFile) {
          const imgBlob = await imageFile.async('blob');
          bgImage.src = URL.createObjectURL(imgBlob);
          bgImage.onload = () => { bgLoaded = true; };
        }

        // Ready to Launch
        document.getElementById('loader-overlay').style.display = 'none';
        startGame();

      } catch (err) {
        console.error(err);
        setStatus('Error parsing package: ' + err.message);
      }
    });

    /**
     * Parse Official Phigros formatVersion 3
     * Precalculates absolute timestamps, floor positions, and hit counters.
     */
    function preprocessChart(chart) {
      totalNotes = 0;

      chart.judgeLineList.forEach((line) => {
        // Pre-compute line floor position cache
        let currentFloor = 0;
        let lastT = 0;
        line.speedEvents.forEach((ev) => {
          ev.startTime = beatsToSeconds(chart, ev.startTime);
          ev.endTime = beatsToSeconds(chart, ev.endTime);
          ev.floorPosition = currentFloor;
          currentFloor += (ev.endTime - ev.startTime) * ev.value;
        });

        // Convert events timing to seconds
        line.judgeLineMoveEvents.forEach(ev => {
          ev.startTime = beatsToSeconds(chart, ev.startTime);
          ev.endTime = beatsToSeconds(chart, ev.endTime);
        });
        line.judgeLineRotateEvents.forEach(ev => {
          ev.startTime = beatsToSeconds(chart, ev.startTime);
          ev.endTime = beatsToSeconds(chart, ev.endTime);
        });
        line.judgeLineDisappearEvents.forEach(ev => {
          ev.startTime = beatsToSeconds(chart, ev.startTime);
          ev.endTime = beatsToSeconds(chart, ev.endTime);
        });

        // Parse Notes (Above & Below Lines)
        const parseNoteList = (notes, isAbove) => {
          notes.forEach(note => {
            totalNotes++;
            note.time = beatsToSeconds(chart, note.time);
            note.holdTime = beatsToSeconds(chart, note.holdTime);
            note.isAbove = isAbove;
            note.state = 'PENDING'; // PENDING, PERFECT, GOOD, BAD, MISS
            note.evaluated = false;
            note.holdProgress = 0;
          });
        };

        if (line.notesAbove) parseNoteList(line.notesAbove, true);
        if (line.notesBelow) parseNoteList(line.notesBelow, false);
      });
    }

    // Convert BPM beat intervals to absolute seconds
    function beatsToSeconds(chart, beat) {
      let time = 0;
      let curBeat = 0;
      const bpmList = chart.BPMList;

      for (let i = 0; i < bpmList.length; i++) {
        const cur = bpmList[i];
        const next = bpmList[i + 1];
        const segBeat = (next && beat > next.startTime ? next.startTime : beat) - cur.startTime;
        if (segBeat > 0) {
          time += (segBeat * 60.0) / cur.bpm;
        }
        if (next && beat >= next.startTime) {
          continue;
        } else {
          break;
        }
      }
      return time;
    }

    function startGame() {
      audioStartTime = audioCtx.currentTime + 0.5; // Half second delay for layout stabilization
      audioSource = audioCtx.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.connect(audioCtx.destination);
      audioSource.start(audioStartTime);
      isPlaying = true;
      requestAnimationFrame(renderLoop);
    }

    // Evaluate interpolation for dynamic events
    function interpolate(startTime, endTime, startVal, endVal, curTime) {
      if (curTime <= startTime) return startVal;
      if (curTime >= endTime) return endVal;
      const ratio = (curTime - startTime) / (endTime - startTime);
      return startVal + (endVal - startVal) * ratio;
    }

    function getLineTransform(line, curTime) {
      // 1. Position: default center is (0.5, 0.5)
      let posX = 0.5, posY = 0.5;
      for (let ev of line.judgeLineMoveEvents) {
        if (curTime >= ev.startTime && curTime <= ev.endTime) {
          posX = interpolate(ev.startTime, ev.endTime, ev.start, ev.end, curTime);
          posY = interpolate(ev.startTime, ev.endTime, ev.start2, ev.end2, curTime);
          break;
        } else if (curTime > ev.endTime) {
          posX = ev.end;
          posY = ev.end2;
        }
      }

      // 2. Rotation: in degrees
      let angle = 0;
      for (let ev of line.judgeLineRotateEvents) {
        if (curTime >= ev.startTime && curTime <= ev.endTime) {
          angle = interpolate(ev.startTime, ev.endTime, ev.start, ev.end, curTime);
          break;
        } else if (curTime > ev.endTime) {
          angle = ev.end;
        }
      }

      // 3. Alpha (Disappear)
      let alpha = 1.0;
      for (let ev of line.judgeLineDisappearEvents) {
        if (curTime >= ev.startTime && curTime <= ev.endTime) {
          alpha = interpolate(ev.startTime, ev.endTime, ev.start, ev.end, curTime);
          break;
        } else if (curTime > ev.endTime) {
          alpha = ev.end;
        }
      }

      // 4. Floor Position computation
      let currentFloor = 0;
      for (let ev of line.speedEvents) {
        if (curTime >= ev.startTime && curTime <= ev.endTime) {
          currentFloor = ev.floorPosition + (curTime - ev.startTime) * ev.value;
          break;
        } else if (curTime > ev.endTime) {
          currentFloor = ev.floorPosition + (ev.endTime - ev.startTime) * ev.value;
        }
      }

      return { x: posX * width, y: (1.0 - posY) * height, angle: -angle, alpha, floor: currentFloor };
    }

    /**
     * Touch / Input Handling System
     */
    function handleTouch(x, y, isFlick = false) {
      if (!chartData || !isPlaying) return;
      const curTime = Math.max(0, audioCtx.currentTime - audioStartTime);

      chartData.judgeLineList.forEach(line => {
        const trans = getLineTransform(line, curTime);
        const rad = (-trans.angle * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        // Convert touch coordinates to judgment line local coordinate system
        const dx = x - trans.x;
        const dy = y - trans.y;
        const localX = dx * cos - dy * sin;

        const checkNotes = (notes) => {
          notes.forEach(note => {
            if (note.state !== 'PENDING') return;
            const dt = Math.abs(note.time - curTime);
            // Check Hitboxes: ~120px lane width allowance
            const noteScreenX = (note.positionX / 9) * (width * 0.6);
            if (Math.abs(localX - noteScreenX) < 130) {
              if (dt <= JUDGE_BAD) {
                if (note.type === 4 && !isFlick) return; // Flick notes require flick gesture
                
                if (dt <= JUDGE_PERFECT) {
                  registerHit(note, 'PERFECT');
                } else if (dt <= JUDGE_GOOD) {
                  registerHit(note, 'GOOD');
                } else {
                  registerHit(note, 'BAD');
                }
              }
            }
          });
        };

        if (line.notesAbove) checkNotes(line.notesAbove);
        if (line.notesBelow) checkNotes(line.notesBelow);
      });
    }

    function registerHit(note, rating) {
      note.state = rating;
      note.evaluated = true;
      if (rating === 'PERFECT') {
        perfectCount++;
        combo++;
      } else if (rating === 'GOOD') {
        goodCount++;
        combo++;
      } else if (rating === 'BAD') {
        badCount++;
        combo = 0;
      } else {
        missCount++;
        combo = 0;
      }
      if (combo > maxCombo) maxCombo = combo;
      recalculateScore();
    }

    function recalculateScore() {
      if (totalNotes === 0) return;
      // Phigros Score = (0.9 * Base Score) + (0.1 * Combo Score)
      const noteScore = (perfectCount * 1.0 + goodCount * 0.65) / totalNotes;
      const comboRatio = maxCombo / totalNotes;
      score = Math.round((noteScore * 900000) + (comboRatio * 100000));
    }

    // Screen Touch Listeners
    canvas.addEventListener('pointerdown', (e) => {
      activeTouches.set(e.pointerId, { startX: e.clientX, startY: e.clientY, curX: e.clientX, curY: e.clientY, time: Date.now() });
      handleTouch(e.clientX, e.clientY, false);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activeTouches.has(e.pointerId)) return;
      const t = activeTouches.get(e.pointerId);
      const deltaDist = Math.hypot(e.clientX - t.startX, e.clientY - t.startY);
      const deltaTime = Date.now() - t.time;

      // Detect high velocity motion as a Flick
      if (deltaDist > 25 && deltaTime < 180) {
        handleTouch(e.clientX, e.clientY, true);
      }
      t.curX = e.clientX;
      t.curY = e.clientY;
    });

    canvas.addEventListener('pointerup', (e) => activeTouches.delete(e.pointerId));
    canvas.addEventListener('pointercancel', (e) => activeTouches.delete(e.pointerId));

    /**
     * Primary Render & Physics Loop
     */
    function renderLoop() {
      if (!isPlaying) return;
      const curTime = Math.max(0, audioCtx.currentTime - audioStartTime);

      // Check for chart completion
      if (curTime > songDuration + 1.5) {
        showSettlement();
        return;
      }

      ctx.clearRect(0, 0, width, height);

      // 1. Draw Background (dimmed & blurred)
      if (bgLoaded) {
        ctx.save();
        ctx.filter = 'brightness(0.35) blur(12px)';
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.restore();
      } else {
        ctx.fillStyle = '#0a0d14';
        ctx.fillRect(0, 0, width, height);
      }

      // 2. Iterate and Render Judgment Lines & Notes
      if (chartData) {
        chartData.judgeLineList.forEach((line) => {
          const trans = getLineTransform(line, curTime);
          if (trans.alpha <= 0.001) return;

          ctx.save();
          ctx.translate(trans.x, trans.y);
          ctx.rotate((trans.angle * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, Math.min(1, trans.alpha));

          // Draw Judgment Line (Standard Phigros glow bar)
          const lineLength = width * 2.5; // Infinite beam span
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(-lineLength, 0);
          ctx.lineTo(lineLength, 0);
          ctx.stroke();

          // Render Attached Notes
          const renderNotes = (notes, isAbove) => {
            const sideFactor = isAbove ? 1 : -1;

            notes.forEach((note) => {
              if (note.state !== 'PENDING') return;

              // Compute Y distance offset via speed integral / time delta
              const timeOffset = note.time - curTime;
              const yOffset = -timeOffset * (height * 0.75) * note.speed * sideFactor;
              const xOffset = (note.positionX / 9) * (width * 0.6);

              // Missing window test
              if (timeOffset < -JUDGE_BAD) {
                registerHit(note, 'MISS');
                return;
              }

              // Auto-hit check for Drag notes
              if (note.type === 2 && Math.abs(timeOffset) <= JUDGE_GOOD) {
                registerHit(note, 'PERFECT');
                return;
              }

              // Draw Note by Type (1: Tap, 2: Drag, 3: Hold, 4: Flick)
              drawNote(ctx, xOffset, yOffset, note, sideFactor);
            });
          };

          if (line.notesAbove) renderNotes(line.notesAbove, true);
          if (line.notesBelow) renderNotes(line.notesBelow, false);

          ctx.restore();
        });
      }

      // 3. Render In-Game HUD
      renderHUD(curTime);

      requestAnimationFrame(renderLoop);
    }

    /**
     * High-Precision Note Rendering
     */
    function drawNote(ctx, x, y, note, sideFactor) {
      const w = width * 0.09;
      const h = 10;

      ctx.save();
      ctx.translate(x, y);

      switch (note.type) {
        case 1: // Tap Note (Cyan)
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-w / 2, -h / 2, w, h);
          ctx.strokeStyle = '#c8e1ff';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-w / 2, -h / 2, w, h);
          break;

        case 2: // Drag Note (Gold diamond)
          ctx.fillStyle = '#ffe57f';
          ctx.beginPath();
          ctx.moveTo(0, -h * 1.2);
          ctx.lineTo(w * 0.35, 0);
          ctx.lineTo(0, h * 1.2);
          ctx.lineTo(-w * 0.35, 0);
          ctx.closePath();
          ctx.fill();
          break;

        case 3: // Hold Note (Long Ribbon)
          const holdHeight = (note.holdTime * (height * 0.75) * note.speed) * sideFactor;
          ctx.fillStyle = 'rgba(121, 192, 255, 0.45)';
          ctx.fillRect(-w / 2, 0, w, -holdHeight);
          // Hold Head
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-w / 2, -h / 2, w, h);
          break;

        case 4: // Flick Note (Red Chevron)
          ctx.fillStyle = '#ff5252';
          ctx.beginPath();
          ctx.moveTo(-w / 2, h);
          ctx.lineTo(0, -h);
          ctx.lineTo(w / 2, h);
          ctx.lineTo(0, 0);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    /**
     * Render Phigros UI (Score, Combo, Pause indicator, Song progress)
     */
    function renderHUD(curTime) {
      ctx.save();
      // Score (Top Right)
      ctx.font = '600 24px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'right';
      ctx.fillText(score.toString().padStart(7, '0'), width - 30, 45);

      // Combo Display (Center Screen)
      if (combo >= 3) {
        ctx.textAlign = 'center';
        ctx.font = '700 38px sans-serif';
        ctx.fillText(combo, width / 2, 80);
        ctx.font = '12px sans-serif';
        ctx.letterSpacing = '4px';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fillText('COMBO', width / 2, 100);
      }

      // Song Progress Bar (Top)
      const progress = Math.min(1.0, curTime / (songDuration || 1));
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(0, 0, width, 3);
      ctx.fillStyle = '#79c0ff';
      ctx.fillRect(0, 0, width * progress, 3);

      ctx.restore();
    }

    /**
     * Settlement Display and Rank Calculation
     */
    function showSettlement() {
      isPlaying = false;
      document.getElementById('settle-overlay').style.display = 'flex';

      // Determine Grade
      let grade = 'False';
      if (score === 1000000) grade = 'φ';
      else if (score >= 960000) grade = 'V';
      else if (score >= 920000) grade = 'S';
      else if (score >= 880000) grade = 'A';
      else if (score >= 820000) grade = 'B';
      else if (score >= 700000) grade = 'C';

      const totalHits = perfectCount + goodCount + badCount + missCount;
      const acc = totalHits > 0 ? (((perfectCount + goodCount * 0.65) / totalHits) * 100).toFixed(2) : '100.00';

      document.getElementById('res-grade').innerText = grade;
      document.getElementById('res-score').innerText = score.toString().padStart(7, '0');
      document.getElementById('res-perf').innerText = perfectCount;
      document.getElementById('res-good').innerText = goodCount;
      document.getElementById('res-bad').innerText = badCount;
      document.getElementById('res-miss').innerText = missCount;
      document.getElementById('res-combo').innerText = maxCombo;
      document.getElementById('res-acc').innerText = `${acc}%`;
    }
  </script>
</body>
</html>
