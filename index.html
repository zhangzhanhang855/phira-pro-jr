<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Phira Pro JR - Web Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Modal / UI Shell */
    .overlay-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.88);
      backdrop-filter: blur(24px);
      transition: opacity 0.3s ease;
    }

    /* Song Selection Hub */
    .hub-container {
      width: 90%;
      max-width: 880px;
      height: 80%;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .hub-title {
      font-size: 24px;
      font-weight: 700;
      color: #79c0ff;
      letter-spacing: 1px;
    }
    .repo-badge {
      font-size: 13px;
      color: #8b949e;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .song-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding-right: 8px;
    }
    .song-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .song-card:hover {
      transform: translateY(-4px);
      border-color: #79c0ff;
      background: rgba(121, 192, 255, 0.08);
    }
    .song-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background: #161b22;
    }
    .song-info {
      padding: 12px;
    }
    .song-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .song-artist {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .song-level {
      font-size: 11px;
      color: #ffe57f;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Settlement Display */
    #settle-overlay {
      display: none;
    }
    .settle-panel {
      width: 85%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
    }
    .settle-rank {
      font-size: 88px;
      font-weight: 900;
      margin: 10px 0;
      color: #ffe57f;
      text-shadow: 0 0 25px rgba(255, 229, 127, 0.4);
    }
    .settle-score {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .settle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .settle-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 0;
    }
    .settle-btn {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .settle-btn:hover { background: #2ea043; }
  </style>
</head>
<body>

  <!-- Song Selector & Repo Sync Hub -->
  <div class="overlay-view" id="select-overlay">
    <div class="hub-container">
      <div class="hub-header">
        <div>
          <div class="hub-title">PHIRA PRO JR</div>
          <div style="font-size: 12px; color: #8b949e; margin-top: 4px;">Dynamic Chart Sync Engine</div>
        </div>
        <div class="repo-badge" id="sync-status">Syncing with zhangzhanhang855/phira-pro-jr...</div>
      </div>
      <div class="song-list" id="song-list-view"></div>
    </div>
  </div>

  <!-- End Game Settlement View -->
  <div class="overlay-view" id="settle-overlay">
    <div class="settle-panel">
      <div style="font-size: 18px; letter-spacing: 3px; color: #8b949e;">CLEAR</div>
      <div class="settle-rank" id="res-grade">φ</div>
      <div class="settle-score" id="res-score">1000000</div>
      <div class="settle-grid">
        <div class="settle-row"><span>Perfect</span><span id="res-perf" style="color: #ffe57f;">0</span></div>
        <div class="settle-row"><span>Good</span><span id="res-good" style="color: #80d8ff;">0</span></div>
        <div class="settle-row"><span>Bad</span><span id="res-bad" style="color: #ff5252;">0</span></div>
        <div class="settle-row"><span>Miss</span><span id="res-miss" style="color: #8b949e;">0</span></div>
        <div class="settle-row"><span>Max Combo</span><span id="res-combo">0</span></div>
        <div class="settle-row"><span>Accuracy</span><span id="res-acc">100.00%</span></div>
      </div>
      <button class="settle-btn" onclick="returnToMenu()">Select Another Song</button>
    </div>
  </div>

  <!-- Main Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <script>
    /**
     * PHIRA PRO JR ENGINE CORE
     * Author: JR AI
     */
    const GITHUB_OWNER = 'zhangzhanhang855';
    const GITHUB_REPO = 'phira-pro-jr';
    const GITHUB_BRANCH = 'main';

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Audio & State
    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;
    let audioStartTime = 0;
    let isPlaying = false;
    let songDuration = 0;

    // Loaded Assets
    let activeChart = null;
    let bgImage = new Image();
    let bgLoaded = false;

    // Scoring & Judgments
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let perfectCount = 0;
    let goodCount = 0;
    let badCount = 0;
    let missCount = 0;
    let totalNotes = 0;

    // Window bounds (ms)
    const JUDGE_PERFECT = 80;
    const JUDGE_GOOD = 160;
    const JUDGE_BAD = 220;

    const activeTouches = new Map();

    /**
     * 1. Auto-synchronize and Discover charts in repository
     */
    async function syncRepositorySongs() {
      const statusBadge = document.getElementById('sync-status');
      const songListView = document.getElementById('song-list-view');

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents?ref=${GITHUB_BRANCH}`;
        const resp = await fetch(apiUrl);

        if (!resp.ok) {
          throw new Error(`GitHub API returned status ${resp.status}`);
        }

        const entries = await resp.json();
        const folderItems = entries.filter(e => e.type === 'dir');

        if (folderItems.length === 0) {
          statusBadge.innerText = 'No chart folders found. Loading demo fallback...';
          renderSongCards([createDemoPackageMeta()]);
          return;
        }

        statusBadge.innerText = `Synced ${folderItems.length} charts from ${GITHUB_REPO}`;
        const songPackages = folderItems.map(item => ({
          id: item.name,
          title: item.name.replace(/[-_]/g, ' ').toUpperCase(),
          artist: 'JR Custom Track',
          level: 'SP Lv.12',
          basePath: `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${item.path}`
        }));

        renderSongCards(songPackages);

      } catch (err) {
        console.warn('Repository sync notice:', err.message);
        statusBadge.innerText = 'GitHub API rate-limited or repo offline. Running demo fallback.';
        renderSongCards([createDemoPackageMeta()]);
      }
    }

    function createDemoPackageMeta() {
      return {
        id: 'demo-song',
        title: 'PROTOTYPE RHYTHM',
        artist: 'JR Synthetic Core',
        level: 'IN Lv.14',
        isDemo: true,
        basePath: ''
      };
    }

    function renderSongCards(packages) {
      const songListView = document.getElementById('song-list-view');
      songListView.innerHTML = '';

      packages.forEach(pkg => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
          <div class="song-thumb" style="display:flex;align-items:center;justify-content:center;color:#484f58;font-size:24px;font-weight:700;">PHIRA</div>
          <div class="song-info">
            <div class="song-name">${pkg.title}</div>
            <div class="song-artist">${pkg.artist}</div>
            <div class="song-level">${pkg.level}</div>
          </div>
        `;
        card.addEventListener('click', () => loadAndStartPackage(pkg));
        songListView.appendChild(card);
      });
    }

    /**
     * 2. Load Selected Song Package
     */
    async function loadAndStartPackage(pkg) {
      document.getElementById('sync-status').innerText = `Loading ${pkg.title}...`;

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        if (pkg.isDemo) {
          setupDemoChart();
        } else {
          // Fetch chart.json
          const chartResp = await fetch(`${pkg.basePath}/chart.json`);
          activeChart = await chartResp.json();

          // Fetch audio.mp3
          const audioResp = await fetch(`${pkg.basePath}/audio.mp3`);
          const audioBuf = await audioResp.arrayBuffer();
          audioBuffer = await audioCtx.decodeAudioData(audioBuf);
          songDuration = audioBuffer.duration;

          // Fetch bg.jpg (Optional)
          bgLoaded = false;
          bgImage.src = `${pkg.basePath}/bg.jpg`;
          bgImage.onload = () => { bgLoaded = true; };
        }

        preprocessActiveChart();
        document.getElementById('select-overlay').style.display = 'none';
        startGame();

      } catch (err) {
        alert(`Failed to load song package: ${err.message}. Falling back to demo chart.`);
        setupDemoChart();
        preprocessActiveChart();
        document.getElementById('select-overlay').style.display = 'none';
        startGame();
      }
    }

    /**
     * Synthetic Demo Chart Generator (Used when repo assets are pending)
     */
    function setupDemoChart() {
      songDuration = 22.0;

      // Synthesize an electronic audio beat buffer
      const sampleRate = audioCtx.sampleRate;
      const numSamples = Math.floor(sampleRate * songDuration);
      audioBuffer = audioCtx.createBuffer(2, numSamples, sampleRate);
      const chL = audioBuffer.getChannelData(0);
      const chR = audioBuffer.getChannelData(1);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        // Kick + hihat synth rhythm
        const kick = Math.sin(2 * Math.PI * 60 * (1 - (t % 0.5)) * (t % 0.5)) * Math.exp(- (t % 0.5) * 8);
        const noise = (Math.random() * 2 - 1) * 0.1 * Math.exp(-((t + 0.25) % 0.5) * 20);
        chL[i] = chR[i] = (t % 0.5 < 0.2 ? kick : 0) + noise;
      }

      // Generate custom JSON chart
      activeChart = {
        offset: 0,
        lines: [
          {
            id: 0,
            moveEvents: [
              { startTime: 0, endTime: 3000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.4 },
              { startTime: 3000, endTime: 6000, startX: 0.5, startY: 0.4, endX: 0.5, endY: 0.6 },
              { startTime: 6000, endTime: 9000, startX: 0.5, startY: 0.6, endX: 0.5, endY: 0.5 }
            ],
            rotateEvents: [
              { startTime: 1000, endTime: 2500, startAngle: 0, endAngle: 18 },
              { startTime: 2500, endTime: 4000, startAngle: 18, endAngle: -18 },
              { startTime: 4000, endTime: 5500, startAngle: -18, endAngle: 0 }
            ],
            alphaEvents: [
              { startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }
            ],
            notes: [
              // Tap
              { type: 'tap', time: 1000, posX: -150, speed: 1.0, isAbove: true },
              { type: 'tap', time: 1500, posX: 150, speed: 1.0, isAbove: true },
              // Drag
              { type: 'drag', time: 2000, posX: -100, speed: 1.0, isAbove: true },
              { type: 'drag', time: 2250, posX: 0, speed: 1.0, isAbove: true },
              { type: 'drag', time: 2500, posX: 100, speed: 1.0, isAbove: true },
              // Hold
              { type: 'hold', time: 3200, holdTime: 1200, posX: -120, speed: 1.0, isAbove: true },
              { type: 'tap', time: 4000, posX: 120, speed: 1.0, isAbove: false },
              // Flick
              { type: 'flick', time: 5000, posX: 0, speed: 1.2, isAbove: true }
            ]
          }
        ]
      };
      bgLoaded = false;
    }

    /**
     * 3. Preprocess Active Chart
     */
    function preprocessActiveChart() {
      totalNotes = 0;
      perfectCount = 0;
      goodCount = 0;
      badCount = 0;
      missCount = 0;
      combo = 0;
      maxCombo = 0;
      score = 0;

      activeChart.lines.forEach(line => {
        if (!line.notes) return;
        line.notes.forEach(note => {
          totalNotes++;
          note.state = 'PENDING';
          note.evaluated = false;
        });
      });
    }

    function startGame() {
      audioStartTime = audioCtx.currentTime + 0.3;
      audioSource = audioCtx.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.connect(audioCtx.destination);
      audioSource.start(audioStartTime);
      isPlaying = true;
      requestAnimationFrame(renderLoop);
    }

    function interpolate(t, sT, eT, sV, eV) {
      if (t <= sT) return sV;
      if (t >= eT) return eV;
      const progress = (t - sT) / (eT - sT);
      return sV + (eV - sV) * progress;
    }

    function getLineState(line, curMs) {
      let x = 0.5, y = 0.5;
      if (line.moveEvents) {
        for (const ev of line.moveEvents) {
          if (curMs >= ev.startTime && curMs <= ev.endTime) {
            x = interpolate(curMs, ev.startTime, ev.endTime, ev.startX, ev.endX);
            y = interpolate(curMs, ev.startTime, ev.endTime, ev.startY, ev.endY);
            break;
          } else if (curMs > ev.endTime) {
            x = ev.endX;
            y = ev.endY;
          }
        }
      }

      let angle = 0;
      if (line.rotateEvents) {
        for (const ev of line.rotateEvents) {
          if (curMs >= ev.startTime && curMs <= ev.endTime) {
            angle = interpolate(curMs, ev.startTime, ev.endTime, ev.startAngle, ev.endAngle);
            break;
          } else if (curMs > ev.endTime) {
            angle = ev.endAngle;
          }
        }
      }

      let alpha = 1.0;
      if (line.alphaEvents) {
        for (const ev of line.alphaEvents) {
          if (curMs >= ev.startTime && curMs <= ev.endTime) {
            alpha = interpolate(curMs, ev.startTime, ev.endTime, ev.startAlpha, ev.endAlpha);
            break;
          } else if (curMs > ev.endTime) {
            alpha = ev.endAlpha;
          }
        }
      }

      return {
        x: x * width,
        y: y * height,
        angle: angle,
        alpha: Math.max(0, Math.min(1, alpha))
      };
    }

    /**
     * 4. Interactive Input Handling
     */
    function triggerHitDetection(posX, posY, isFlick = false) {
      if (!isPlaying || !activeChart) return;
      const curMs = (audioCtx.currentTime - audioStartTime) * 1000 - (activeChart.offset || 0);

      activeChart.lines.forEach(line => {
        const state = getLineState(line, curMs);
        const rad = (-state.angle * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        const dx = posX - state.x;
        const dy = posY - state.y;
        const localX = dx * cos - dy * sin;

        line.notes.forEach(note => {
          if (note.state !== 'PENDING') return;
          const dt = Math.abs(note.time - curMs);

          // Note hit boundary (x-axis tolerance ~100px)
          if (Math.abs(localX - note.posX) <= 100) {
            if (dt <= JUDGE_BAD) {
              if (note.type === 'flick' && !isFlick) return;

              if (dt <= JUDGE_PERFECT) registerHit(note, 'PERFECT');
              else if (dt <= JUDGE_GOOD) registerHit(note, 'GOOD');
              else registerHit(note, 'BAD');
            }
          }
        });
      });
    }

    function registerHit(note, rating) {
      note.state = rating;
      note.evaluated = true;

      if (rating === 'PERFECT') {
        perfectCount++;
        combo++;
      } else if (rating === 'GOOD') {
        goodCount++;
        combo++;
      } else if (rating === 'BAD') {
        badCount++;
        combo = 0;
      } else {
        missCount++;
        combo = 0;
      }

      if (combo > maxCombo) maxCombo = combo;
      recalculateScore();
    }

    function recalculateScore() {
      if (totalNotes === 0) return;
      const hitRatio = (perfectCount * 1.0 + goodCount * 0.65) / totalNotes;
      const comboRatio = maxCombo / totalNotes;
      score = Math.round((hitRatio * 900000) + (comboRatio * 100000));
    }

    canvas.addEventListener('pointerdown', (e) => {
      activeTouches.set(e.pointerId, { sx: e.clientX, sy: e.clientY, time: Date.now() });
      triggerHitDetection(e.clientX, e.clientY, false);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activeTouches.has(e.pointerId)) return;
      const t = activeTouches.get(e.pointerId);
      const dist = Math.hypot(e.clientX - t.sx, e.clientY - t.sy);
      const dt = Date.now() - t.time;

      if (dist > 25 && dt < 180) {
        triggerHitDetection(e.clientX, e.clientY, true);
      }
    });

    canvas.addEventListener('pointerup', (e) => activeTouches.delete(e.pointerId));
    canvas.addEventListener('pointercancel', (e) => activeTouches.delete(e.pointerId));

    /**
     * 5. Game Loop & Rendering Pipeline
     */
    function renderLoop() {
      if (!isPlaying) return;
      const curSec = audioCtx.currentTime - audioStartTime;
      const curMs = curSec * 1000 - (activeChart.offset || 0);

      // Check chart completion
      if (curSec > songDuration + 1.2) {
        finishPlay();
        return;
      }

      ctx.clearRect(0, 0, width, height);

      // Background
      if (bgLoaded) {
        ctx.save();
        ctx.filter = 'brightness(0.35) blur(16px)';
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.restore();
      } else {
        ctx.fillStyle = '#0a0d13';
        ctx.fillRect(0, 0, width, height);
      }

      // Judgment Lines & Notes
      if (activeChart) {
        activeChart.lines.forEach(line => {
          const state = getLineState(line, curMs);
          if (state.alpha <= 0.01) return;

          ctx.save();
          ctx.translate(state.x, state.y);
          ctx.rotate((state.angle * Math.PI) / 180);
          ctx.globalAlpha = state.alpha;

          // Render Judgment Line
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(-width * 2, 0);
          ctx.lineTo(width * 2, 0);
          ctx.stroke();

          // Render Notes
          line.notes.forEach(note => {
            if (note.state !== 'PENDING') return;

            const dt = note.time - curMs;
            const side = note.isAbove ? -1 : 1;
            const speedFactor = note.speed * (height * 0.0012);
            const yOffset = dt * speedFactor * side;

            // Miss boundary
            if (dt < -JUDGE_BAD) {
              registerHit(note, 'MISS');
              return;
            }

            // Drag auto-trigger
            if (note.type === 'drag' && Math.abs(dt) <= JUDGE_GOOD) {
              registerHit(note, 'PERFECT');
              return;
            }

            drawNoteItem(ctx, note.posX, yOffset, note, side);
          });

          ctx.restore();
        });
      }

      // In-game HUD
      drawHUD(curSec);

      requestAnimationFrame(renderLoop);
    }

    function drawNoteItem(ctx, x, y, note, side) {
      const nw = 90;
      const nh = 10;
      ctx.save();
      ctx.translate(x, y);

      switch (note.type) {
        case 'tap':
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          ctx.strokeStyle = '#e6f1ff';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
          break;

        case 'drag':
          ctx.fillStyle = '#ffe57f';
          ctx.beginPath();
          ctx.moveTo(0, -nh * 1.3);
          ctx.lineTo(nw * 0.32, 0);
          ctx.lineTo(0, nh * 1.3);
          ctx.lineTo(-nw * 0.32, 0);
          ctx.closePath();
          ctx.fill();
          break;

        case 'hold':
          const holdLength = (note.holdTime * note.speed * (height * 0.0012)) * -side;
          ctx.fillStyle = 'rgba(121, 192, 255, 0.45)';
          ctx.fillRect(-nw / 2, 0, nw, holdLength);
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          break;

        case 'flick':
          ctx.fillStyle = '#ff5252';
          ctx.beginPath();
          ctx.moveTo(-nw / 2, nh);
          ctx.lineTo(0, -nh);
          ctx.lineTo(nw / 2, nh);
          ctx.lineTo(0, 0);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    function drawHUD(curSec) {
      ctx.save();
      // Score Top-Right
      ctx.font = '600 24px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'right';
      ctx.fillText(score.toString().padStart(7, '0'), width - 32, 44);

      // Center Combo
      if (combo >= 3) {
        ctx.textAlign = 'center';
        ctx.font = '700 36px sans-serif';
        ctx.fillText(combo, width / 2, 80);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.letterSpacing = '4px';
        ctx.fillText('COMBO', width / 2, 100);
      }

      // Progress bar
      const prog = Math.min(1.0, curSec / (songDuration || 1));
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fillRect(0, 0, width, 3);
      ctx.fillStyle = '#79c0ff';
      ctx.fillRect(0, 0, width * prog, 3);

      ctx.restore();
    }

    /**
     * 6. Settlement & Return
     */
    function finishPlay() {
      isPlaying = false;
      document.getElementById('settle-overlay').style.display = 'flex';

      let grade = 'False';
      if (score === 1000000) grade = 'φ';
      else if (score >= 960000) grade = 'V';
      else if (score >= 920000) grade = 'S';
      else if (score >= 880000) grade = 'A';
      else if (score >= 820000) grade = 'B';
      else if (score >= 700000) grade = 'C';

      const totalHits = perfectCount + goodCount + badCount + missCount;
      const acc = totalHits > 0 ? (((perfectCount + goodCount * 0.65) / totalHits) * 100).toFixed(2) : '100.00';

      document.getElementById('res-grade').innerText = grade;
      document.getElementById('res-score').innerText = score.toString().padStart(7, '0');
      document.getElementById('res-perf').innerText = perfectCount;
      document.getElementById('res-good').innerText = goodCount;
      document.getElementById('res-bad').innerText = badCount;
      document.getElementById('res-miss').innerText = missCount;
      document.getElementById('res-combo').innerText = maxCombo;
      document.getElementById('res-acc').innerText = `${acc}%`;
    }

    function returnToMenu() {
      document.getElementById('settle-overlay').style.display = 'none';
      document.getElementById('select-overlay').style.display = 'flex';
      syncRepositorySongs();
    }

    // Auto-launch sync upon opening the page
    window.addEventListener('DOMContentLoaded', () => {
      syncRepositorySongs();
    });
  </script>
</body>
</html>
