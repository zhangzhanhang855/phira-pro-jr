<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Phira Pro JR - Web Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      color: #fff;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Modal / Hub Overlay */
    .overlay-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.9);
      backdrop-filter: blur(24px);
    }

    /* Song Selection Hub */
    .hub-container {
      width: 90%;
      max-width: 880px;
      height: 80%;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .hub-title {
      font-size: 24px;
      font-weight: 700;
      color: #79c0ff;
      letter-spacing: 1px;
    }
    .repo-badge {
      font-size: 13px;
      color: #8b949e;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 50%;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .song-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding-right: 8px;
    }
    .song-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .song-card:hover {
      transform: translateY(-4px);
      border-color: #79c0ff;
      background: rgba(121, 192, 255, 0.08);
    }
    .song-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background: #161b22;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #484f58;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .song-info {
      padding: 12px;
    }
    .song-name {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .song-artist {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .song-level {
      font-size: 11px;
      color: #ffe57f;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Settlement Screen */
    #settle-overlay {
      display: none;
    }
    .settle-panel {
      width: 85%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
    }
    .settle-rank {
      font-size: 88px;
      font-weight: 900;
      margin: 8px 0;
      color: #ffe57f;
      text-shadow: 0 0 25px rgba(255, 229, 127, 0.4);
    }
    .settle-score {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 2px;
    }
    .settle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .settle-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 0;
    }
    .settle-btn {
      background: #238636;
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .settle-btn:hover { background: #2ea043; }
  </style>
</head>
<body>

  <!-- 歌曲選擇器 -->
  <div class="overlay-view" id="select-overlay">
    <div class="hub-container">
      <div class="hub-header">
        <div>
          <div class="hub-title">PHIRA PRO JR</div>
          <div style="font-size: 12px; color: #8b949e; margin-top: 4px;">formatVersion: 3 引擎</div>
        </div>
        <div class="repo-badge" id="sync-status">正在連線 GitHub 倉庫...</div>
      </div>
      <div class="song-list" id="song-list-view"></div>
    </div>
  </div>

  <!-- 結算畫面 -->
  <div class="overlay-view" id="settle-overlay">
    <div class="settle-panel">
      <div style="font-size: 18px; letter-spacing: 3px; color: #8b949e;">STAGE CLEAR</div>
      <div class="settle-rank" id="res-grade">φ</div>
      <div class="settle-score" id="res-score">1000000</div>
      <div class="settle-grid">
        <div class="settle-row"><span>Perfect</span><span id="res-perf" style="color: #ffe57f;">0</span></div>
        <div class="settle-row"><span>Good</span><span id="res-good" style="color: #80d8ff;">0</span></div>
        <div class="settle-row"><span>Bad</span><span id="res-bad" style="color: #ff5252;">0</span></div>
        <div class="settle-row"><span>Miss</span><span id="res-miss" style="color: #8b949e;">0</span></div>
        <div class="settle-row"><span>Max Combo</span><span id="res-combo">0</span></div>
        <div class="settle-row"><span>Accuracy</span><span id="res-acc">100.00%</span></div>
      </div>
      <button class="settle-btn" onclick="returnToMenu()">返回選曲</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script>
    /**
     * PHIRA PRO JR formatVersion: 3 執行引擎
     */
    const GITHUB_OWNER = 'zhangzhanhang855';
    const GITHUB_REPO = 'phira-pro-jr';

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Audio & State
    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;
    let audioStartTime = 0;
    let isPlaying = false;
    let songDuration = 0;

    // Loaded Assets
    let activeChart = null;
    let bgImage = new Image();
    let bgLoaded = false;

    // Judgments & Scoring
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let perfectCount = 0;
    let goodCount = 0;
    let badCount = 0;
    let missCount = 0;
    let totalNotes = 0;

    // Standard Phigros Judge Windows (Seconds)
    const JUDGE_PERFECT = 0.08;
    const JUDGE_GOOD = 0.16;
    const JUDGE_BAD = 0.20;

    const activeTouches = new Map();

    /**
     * 1. GitHub 倉庫同步
     */
    async function syncRepositorySongs() {
      const statusBadge = document.getElementById('sync-status');
      statusBadge.innerText = '正在連線 GitHub 倉庫...';

      try {
        const repoResp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`);
        if (!repoResp.ok) throw new Error(`HTTP ${repoResp.status}`);
        const repoInfo = await repoResp.json();
        const branch = repoInfo.default_branch || 'main';

        const contentsResp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents?ref=${branch}`);
        if (!contentsResp.ok) throw new Error(`HTTP ${contentsResp.status}`);

        const entries = await contentsResp.json();
        const folders = entries.filter(e => e.type === 'dir');

        if (folders.length === 0) {
          statusBadge.innerText = '未找到譜面文件夾，加載備用演示...';
          renderSongCards([createDemoPackageMeta()]);
          return;
        }

        statusBadge.innerText = `已同步 ${folders.length} 首曲目`;
        const songPackages = folders.map(f => ({
          id: f.name,
          title: f.name.replace(/[-_]/g, ' '),
          artist: 'Phira Track',
          level: 'IN Lv.12',
          isDemo: false,
          basePath: `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${branch}/${encodeURIComponent(f.name)}`
        }));

        renderSongCards(songPackages);
      } catch (err) {
        console.warn('Sync notice:', err.message);
        statusBadge.innerText = 'GitHub API 受限，切換至備用演示。';
        renderSongCards([createDemoPackageMeta()]);
      }
    }

    function createDemoPackageMeta() {
      return {
        id: 'demo-song',
        title: 'BATIDAO FUNK (DEMO)',
        artist: 'JR Sound Labs',
        level: 'IN Lv.12',
        isDemo: true,
        basePath: ''
      };
    }

    function renderSongCards(packages) {
      const songListView = document.getElementById('song-list-view');
      songListView.innerHTML = '';

      packages.forEach(pkg => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
          <div class="song-thumb">PHIRA</div>
          <div class="song-info">
            <div class="song-name">${pkg.title}</div>
            <div class="song-artist">${pkg.artist}</div>
            <div class="song-level">${pkg.level}</div>
          </div>
        `;
        card.addEventListener('click', () => loadAndStartPackage(pkg));
        songListView.appendChild(card);
      });
    }

    /**
     * 2. 資源加載
     */
    async function loadAndStartPackage(pkg) {
      const statusElem = document.getElementById('sync-status');
      if (statusElem) statusElem.innerText = `正在加載 ${pkg.title}...`;

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        if (pkg.isDemo) {
          setupDemoChart();
          preprocessChart(activeChart);
          document.getElementById('select-overlay').style.display = 'none';
          startGame();
          return;
        }

        async function fetchWithFallbacks(candidateNames) {
          for (const name of candidateNames) {
            try {
              const url = `${pkg.basePath}/${encodeURIComponent(name)}`;
              const res = await fetch(url);
              if (res.ok) return { res, name };
            } catch (e) {}
          }
          return null;
        }

        // 讀取 chart.json
        const chartResult = await fetchWithFallbacks(['chart.json', 'Chart.json']);
        if (!chartResult) throw new Error(`在 ${pkg.id} 中未找到 chart.json`);
        activeChart = await chartResult.res.json();

        // 讀取音訊
        const audioResult = await fetchWithFallbacks(['audio.mp3', 'song.mp3', 'audio.ogg', 'song.ogg', 'music.mp3']);
        if (!audioResult) throw new Error(`在 ${pkg.id} 中未找到音頻文件 (audio.mp3)`);
        const audioData = await audioResult.res.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(audioData);
        songDuration = audioBuffer.duration;

        // 讀取背景圖 (可選)
        const bgResult = await fetchWithFallbacks(['bg.jpg', 'bg.png', 'cover.jpg', 'illustration.jpg']);
        if (bgResult) {
          const imgBlob = await bgResult.res.blob();
          bgImage.src = URL.createObjectURL(imgBlob);
          bgImage.onload = () => { bgLoaded = true; };
        } else {
          bgLoaded = false;
        }

        preprocessChart(activeChart);
        document.getElementById('select-overlay').style.display = 'none';
        startGame();

      } catch (err) {
        console.error(err);
        alert(`加載失敗: ${err.message}\n\n正在切換至演示譜面...`);
        setupDemoChart();
        preprocessChart(activeChart);
        document.getElementById('select-overlay').style.display = 'none';
        startGame();
      }
    }

    /**
     * 演示譜面
     */
    function setupDemoChart() {
      songDuration = 15.0;
      const sampleRate = audioCtx.sampleRate;
      const numSamples = Math.floor(sampleRate * songDuration);
      audioBuffer = audioCtx.createBuffer(2, numSamples, sampleRate);
      const chL = audioBuffer.getChannelData(0);
      const chR = audioBuffer.getChannelData(1);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const kick = Math.sin(2 * Math.PI * 60 * (1 - (t % 0.5)) * (t % 0.5)) * Math.exp(-(t % 0.5) * 8);
        chL[i] = chR[i] = (t % 0.5 < 0.2 ? kick : 0);
      }

      // 與您提供的 chart.json 格式完全相同
      activeChart = {
        formatVersion: 3,
        offset: 0.0,
        numOfNotes: 11,
        judgeLineList: [
          {
            id: 0,
            group: 0,
            notesAbove: [
              { type: 1, time: 0.4, positionX: -4.0, holdTime: 0.0, speed: 1.0, floorPosition: 0.48 },
              { type: 1, time: 0.8, positionX: 4.0, holdTime: 0.0, speed: 1.0, floorPosition: 0.96 },
              { type: 3, time: 1.2, positionX: 0.0, holdTime: 0.8, speed: 1.0, floorPosition: 1.44 },
              { type: 4, time: 2.4, positionX: -6.0, holdTime: 0.0, speed: 1.0, floorPosition: 2.88 },
              { type: 4, time: 2.6, positionX: 6.0, holdTime: 0.0, speed: 1.0, floorPosition: 3.12 },
              { type: 1, time: 10.0, positionX: -3.0, holdTime: 0.0, speed: 1.2, floorPosition: 12.0 },
              { type: 1, time: 10.2, positionX: 3.0, holdTime: 0.0, speed: 1.2, floorPosition: 12.24 },
              { type: 2, time: 10.4, positionX: -5.0, holdTime: 0.0, speed: 1.2, floorPosition: 12.48 },
              { type: 2, time: 10.5, positionX: -2.0, holdTime: 0.0, speed: 1.2, floorPosition: 12.6 },
              { type: 2, time: 10.6, positionX: 2.0, holdTime: 0.0, speed: 1.2, floorPosition: 12.72 },
              { type: 2, time: 10.7, positionX: 5.0, holdTime: 0.0, speed: 1.2, floorPosition: 12.84 }
            ],
            notesBelow: [],
            speedEvents: [
              { startTime: 0.0, endTime: 10.0, value: 1.2 },
              { startTime: 10.0, endTime: 20.0, value: 1.5 }
            ],
            judgeLineMoveEvents: [
              { startTime: 0.0, endTime: 0.5, start: 0.5, end: 0.5, start2: 0.1, end2: 0.5 },
              { startTime: 9.8, endTime: 10.2, start: 0.5, end: 0.5, start2: 0.5, end2: 0.6 }
            ],
            judgeLineRotateEvents: [
              { startTime: 0.0, endTime: 10.0, start: 0.0, end: 0.0 },
              { startTime: 10.0, endTime: 11.0, start: 0.0, end: 15.0 },
              { startTime: 11.0, endTime: 12.0, start: 15.0, end: -15.0 }
            ],
            judgeLineDisappearEvents: [
              { startTime: 0.0, endTime: 999.0, start: 1.0, end: 1.0 }
            ]
          }
        ]
      };
      bgLoaded = false;
    }

    /**
     * 3. 核心譜面預處理 (formatVersion: 3)
     */
    function preprocessChart(chart) {
      totalNotes = 0;
      perfectCount = 0;
      goodCount = 0;
      badCount = 0;
      missCount = 0;
      combo = 0;
      maxCombo = 0;
      score = 0;

      chart.judgeLineList.forEach(line => {
        // 預計算速度事件累積的 floorPosition 基準
        let accumulatedFloor = 0;
        if (line.speedEvents) {
          line.speedEvents.forEach(ev => {
            ev.floorPosition = accumulatedFloor;
            accumulatedFloor += (ev.endTime - ev.startTime) * ev.value;
          });
        }

        const setupNotes = (notes, isAbove) => {
          if (!notes) return;
          notes.forEach(note => {
            totalNotes++;
            note.isAbove = isAbove;
            note.state = 'PENDING';
            note.evaluated = false;
            // 若譜面沒有包含 floorPosition，自動依照速度事件反推
            if (typeof note.floorPosition === 'undefined') {
              note.floorPosition = computeFloorAt(line, note.time);
            }
          });
        };

        setupNotes(line.notesAbove, true);
        setupNotes(line.notesBelow, false);
      });
    }

    function computeFloorAt(line, timeSec) {
      if (!line.speedEvents || line.speedEvents.length === 0) return timeSec * 1.0;
      for (let ev of line.speedEvents) {
        if (timeSec >= ev.startTime && timeSec <= ev.endTime) {
          return ev.floorPosition + (timeSec - ev.startTime) * ev.value;
        } else if (timeSec > ev.endTime) {
          // 暫存最後一個
        }
      }
      const last = line.speedEvents[line.speedEvents.length - 1];
      return last.floorPosition + (timeSec - last.endTime) * last.value;
    }

    function startGame() {
      audioStartTime = audioCtx.currentTime + 0.3;
      audioSource = audioCtx.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.connect(audioCtx.destination);
      audioSource.start(audioStartTime);
      isPlaying = true;
      requestAnimationFrame(renderLoop);
    }

    function interpolate(t, sT, eT, sV, eV) {
      if (t <= sT) return sV;
      if (t >= eT) return eV;
      return sV + (eV - sV) * ((t - sT) / (eT - sT));
    }

    /**
     * 4. 判定線動態狀態計算
     */
    function getLineState(line, curSec) {
      // 1. 位置: start/end 為 X (0~1), start2/end2 為 Y (0~1, 官方0在底, 1在頂)
      let posX = 0.5, posY = 0.5;
      if (line.judgeLineMoveEvents) {
        for (let ev of line.judgeLineMoveEvents) {
          if (curSec >= ev.startTime && curSec <= ev.endTime) {
            posX = interpolate(curSec, ev.startTime, ev.endTime, ev.start, ev.end);
            posY = interpolate(curSec, ev.startTime, ev.endTime, ev.start2, ev.end2);
            break;
          } else if (curSec > ev.endTime) {
            posX = ev.end;
            posY = ev.end2;
          }
        }
      }

      // 2. 角度: 逆時針/順時針
      let angle = 0;
      if (line.judgeLineRotateEvents) {
        for (let ev of line.judgeLineRotateEvents) {
          if (curSec >= ev.startTime && curSec <= ev.endTime) {
            angle = interpolate(curSec, ev.startTime, ev.endTime, ev.start, ev.end);
            break;
          } else if (curSec > ev.endTime) {
            angle = ev.end;
          }
        }
      }

      // 3. 透明度
      let alpha = 1.0;
      if (line.judgeLineDisappearEvents) {
        for (let ev of line.judgeLineDisappearEvents) {
          if (curSec >= ev.startTime && curSec <= ev.endTime) {
            alpha = interpolate(curSec, ev.startTime, ev.endTime, ev.start, ev.end);
            break;
          } else if (curSec > ev.endTime) {
            alpha = ev.end;
          }
        }
      }

      // 4. 當前 FloorPosition 計算
      let currentFloor = 0;
      if (line.speedEvents && line.speedEvents.length > 0) {
        for (let ev of line.speedEvents) {
          if (curSec >= ev.startTime && curSec <= ev.endTime) {
            currentFloor = ev.floorPosition + (curSec - ev.startTime) * ev.value;
            break;
          } else if (curSec > ev.endTime) {
            currentFloor = ev.floorPosition + (ev.endTime - ev.startTime) * ev.value;
          }
        }
      } else {
        currentFloor = curSec * 1.0;
      }

      return {
        x: posX * width,
        y: (1.0 - posY) * height, // 轉換 Phigros 坐標系到 Canvas 屏幕
        angle: -angle,
        alpha: Math.max(0, Math.min(1, alpha)),
        floor: currentFloor
      };
    }

    /**
     * 5. 判定與輸入檢測
     */
    function triggerHitDetection(touchX, touchY, isFlick = false) {
      if (!isPlaying || !activeChart) return;
      const curSec = Math.max(0, audioCtx.currentTime - audioStartTime) - (activeChart.offset || 0.0);

      activeChart.judgeLineList.forEach(line => {
        const state = getLineState(line, curSec);
        const rad = (-state.angle * Math.PI) / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);

        // 轉換觸控座標到判定線本地空間
        const dx = touchX - state.x;
        const dy = touchY - state.y;
        const localX = dx * cos - dy * sin;

        const checkNotes = (notes) => {
          if (!notes) return;
          notes.forEach(note => {
            if (note.state !== 'PENDING') return;
            const dt = Math.abs(note.time - curSec);

            // Phigros 坐標：positionX 在 [-9, 9] 映射為屏幕寬度 60%
            const noteScreenX = (note.positionX / 9) * (width * 0.6);

            // 橫向容差 ~120px
            if (Math.abs(localX - noteScreenX) <= 120) {
              if (dt <= JUDGE_BAD) {
                if (note.type === 4 && !isFlick) return; // Flick 需要滑動

                if (dt <= JUDGE_PERFECT) registerHit(note, 'PERFECT');
                else if (dt <= JUDGE_GOOD) registerHit(note, 'GOOD');
                else registerHit(note, 'BAD');
              }
            }
          });
        };

        checkNotes(line.notesAbove);
        checkNotes(line.notesBelow);
      });
    }

    function registerHit(note, rating) {
      note.state = rating;
      note.evaluated = true;

      if (rating === 'PERFECT') {
        perfectCount++;
        combo++;
      } else if (rating === 'GOOD') {
        goodCount++;
        combo++;
      } else if (rating === 'BAD') {
        badCount++;
        combo = 0;
      } else {
        missCount++;
        combo = 0;
      }

      if (combo > maxCombo) maxCombo = combo;
      recalculateScore();
    }

    function recalculateScore() {
      if (totalNotes === 0) return;
      const hitRatio = (perfectCount * 1.0 + goodCount * 0.65) / totalNotes;
      const comboRatio = maxCombo / totalNotes;
      score = Math.round((hitRatio * 900000) + (comboRatio * 100000));
    }

    canvas.addEventListener('pointerdown', (e) => {
      activeTouches.set(e.pointerId, { sx: e.clientX, sy: e.clientY, time: Date.now() });
      triggerHitDetection(e.clientX, e.clientY, false);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activeTouches.has(e.pointerId)) return;
      const t = activeTouches.get(e.pointerId);
      const dist = Math.hypot(e.clientX - t.sx, e.clientY - t.sy);
      const dt = Date.now() - t.time;

      if (dist > 25 && dt < 180) {
        triggerHitDetection(e.clientX, e.clientY, true);
      }
    });

    canvas.addEventListener('pointerup', (e) => activeTouches.delete(e.pointerId));
    canvas.addEventListener('pointercancel', (e) => activeTouches.delete(e.pointerId));

    /**
     * 6. 核心渲染循環
     */
    function renderLoop() {
      if (!isPlaying) return;
      const curSec = audioCtx.currentTime - audioStartTime - (activeChart.offset || 0.0);

      if (curSec > songDuration + 1.2) {
        finishPlay();
        return;
      }

      ctx.clearRect(0, 0, width, height);

      // 背景
      if (bgLoaded) {
        ctx.save();
        ctx.filter = 'brightness(0.35) blur(16px)';
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.restore();
      } else {
        ctx.fillStyle = '#0a0d13';
        ctx.fillRect(0, 0, width, height);
      }

      // 繪製判定線與音符
      if (activeChart) {
        activeChart.judgeLineList.forEach(line => {
          const state = getLineState(line, curSec);
          if (state.alpha <= 0.005) return;

          ctx.save();
          ctx.translate(state.x, state.y);
          ctx.rotate((state.angle * Math.PI) / 180);
          ctx.globalAlpha = state.alpha;

          // 判定線主體
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(-width * 2, 0);
          ctx.lineTo(width * 2, 0);
          ctx.stroke();

          // 渲染線上方與線下方音符
          const renderNotes = (notes, isAbove) => {
            if (!notes) return;
            const side = isAbove ? 1 : -1;

            notes.forEach(note => {
              if (note.state !== 'PENDING') return;

              // 基于 floorPosition 的高精度 Phigros 位移計算
              const deltaFloor = note.floorPosition - state.floor;
              const yOffset = -deltaFloor * (height * 0.6) * side;
              const xOffset = (note.positionX / 9) * (width * 0.6);

              // 漏鍵 (Miss) 判定
              const dt = note.time - curSec;
              if (dt < -JUDGE_BAD) {
                registerHit(note, 'MISS');
                return;
              }

              // Drag (Type 2) 音符接近自動判定
              if (note.type === 2 && Math.abs(dt) <= JUDGE_GOOD) {
                registerHit(note, 'PERFECT');
                return;
              }

              // 超出視窗範圍則剔除
              if (Math.abs(yOffset) < height * 1.5) {
                drawNoteItem(ctx, xOffset, yOffset, note, side);
              }
            });
          };

          renderNotes(line.notesAbove, true);
          renderNotes(line.notesBelow, false);

          ctx.restore();
        });
      }

      drawHUD(curSec);
      requestAnimationFrame(renderLoop);
    }

    /**
     * 7. 4 種音符圖形繪製 (Type 1: Tap, Type 2: Drag, Type 3: Hold, Type 4: Flick)
     */
    function drawNoteItem(ctx, x, y, note, side) {
      const nw = width * 0.085;
      const nh = 10;
      ctx.save();
      ctx.translate(x, y);

      switch (note.type) {
        case 1: // Tap (Cyan)
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          ctx.strokeStyle = '#e6f1ff';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
          break;

        case 2: // Drag (Gold)
          ctx.fillStyle = '#ffe57f';
          ctx.beginPath();
          ctx.moveTo(0, -nh * 1.3);
          ctx.lineTo(nw * 0.35, 0);
          ctx.lineTo(0, nh * 1.3);
          ctx.lineTo(-nw * 0.35, 0);
          ctx.closePath();
          ctx.fill();
          break;

        case 3: // Hold (Green/Cyan Ribbon)
          const holdLength = (note.holdTime * (height * 0.6) * (note.speed || 1.0)) * side;
          ctx.fillStyle = 'rgba(121, 192, 255, 0.45)';
          ctx.fillRect(-nw / 2, 0, nw, -holdLength);
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          break;

        case 4: // Flick (Red Chevron)
          ctx.fillStyle = '#ff7b72';
          ctx.beginPath();
          ctx.moveTo(-nw / 2, nh);
          ctx.lineTo(0, -nh);
          ctx.lineTo(nw / 2, nh);
          ctx.lineTo(0, 0);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    function drawHUD(curSec) {
      ctx.save();
      // Score (Top Right)
      ctx.font = '600 24px monospace';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'right';
      ctx.fillText(score.toString().padStart(7, '0'), width - 32, 44);

      // Center Combo
      if (combo >= 3) {
        ctx.textAlign = 'center';
        ctx.font = '700 36px sans-serif';
        ctx.fillText(combo, width / 2, 80);
        ctx.font = '12px sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.letterSpacing = '4px';
        ctx.fillText('COMBO', width / 2, 100);
      }

      // 進度條
      const prog = Math.min(1.0, Math.max(0, curSec / (songDuration || 1)));
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fillRect(0, 0, width, 3);
      ctx.fillStyle = '#79c0ff';
      ctx.fillRect(0, 0, width * prog, 3);

      ctx.restore();
    }

    /**
     * 8. 結算與畫面控制
     */
    function finishPlay() {
      isPlaying = false;
      document.getElementById('settle-overlay').style.display = 'flex';

      let grade = 'False';
      if (score === 1000000) grade = 'φ';
      else if (score >= 960000) grade = 'V';
      else if (score >= 920000) grade = 'S';
      else if (score >= 880000) grade = 'A';
      else if (score >= 820000) grade = 'B';
      else if (score >= 700000) grade = 'C';

      const totalHits = perfectCount + goodCount + badCount + missCount;
      const acc = totalHits > 0 ? (((perfectCount + goodCount * 0.65) / totalHits) * 100).toFixed(2) : '100.00';

      document.getElementById('res-grade').innerText = grade;
      document.getElementById('res-score').innerText = score.toString().padStart(7, '0');
      document.getElementById('res-perf').innerText = perfectCount;
      document.getElementById('res-good').innerText = goodCount;
      document.getElementById('res-bad').innerText = badCount;
      document.getElementById('res-miss').innerText = missCount;
      document.getElementById('res-combo').innerText = maxCombo;
      document.getElementById('res-acc').innerText = `${acc}%`;
    }

    function returnToMenu() {
      document.getElementById('settle-overlay').style.display = 'none';
      document.getElementById('select-overlay').style.display = 'flex';
      syncRepositorySongs();
    }

    window.addEventListener('DOMContentLoaded', () => {
      syncRepositorySongs();
    });
  </script>
</body>
