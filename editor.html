<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phira Pro JR - 制谱工坊</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --tap-c: #79c0ff;
      --drag-c: #ffe57f;
      --hold-c: #56d364;
      --flick-c: #ff7b72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 左侧控制栏 */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .box-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .form-item:last-child { margin-bottom: 0; }
    .form-item label {
      font-size: 11px;
      color: var(--text-dim);
    }

    input, select, button {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 8px;
    }
    .row > * { flex: 1; }

    .btn {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
      text-align: center;
    }
    .btn-green { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-green:hover { background: #2ea043; }
    .btn-blue { background: #1f6feb; border-color: #388bfd; color: #fff; }
    .btn-blue:hover { background: #388bfd; }
    .btn-gray { background: #21262d; border-color: var(--border); color: #fff; }
    .btn-gray:hover { background: #30363d; }

    /* 文件选择器自定义容器 */
    .file-upload-box {
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .file-upload-box input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* 判定线列表 */
    .line-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      margin-top: 8px;
    }
    .line-item {
      padding: 8px 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 12px;
    }
    .line-item.active {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.1);
    }

    /* 右侧主工作区 */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 顶部控制栏 */
    .top-toolbar {
      height: 52px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 5;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .timer {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      min-width: 90px;
    }

    /* 音符类型切换 */
    .note-selector {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .note-tab {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #0d1117;
      transition: 0.15s;
    }
    .note-tab.active[data-type="tap"] { background: var(--tap-c); color: #000; border-color: var(--tap-c); }
    .note-tab.active[data-type="drag"] { background: var(--drag-c); color: #000; border-color: var(--drag-c); }
    .note-tab.active[data-type="hold"] { background: var(--hold-c); color: #000; border-color: var(--hold-c); }
    .note-tab.active[data-type="flick"] { background: var(--flick-c); color: #000; border-color: var(--flick-c); }

    /* 主画布 */
    #stage-canvas {
      flex: 1;
      background: #05070a;
      cursor: crosshair;
    }

    /* 底部时间轴 */
    .timeline-wrap {
      height: 120px;
      background: #11151c;
      border-top: 1px solid var(--border);
      position: relative;
      overflow-x: scroll;
      overflow-y: hidden;
    }
    #timeline-canvas {
      height: 100%;
      display: block;
    }

    .bottom-status {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
  </style>
</head>
<body>

  <!-- 左侧控制面板 -->
  <div class="sidebar">
    <div class="panel-header">
      <h2>PHIRA PRO JR 谱面制作</h2>
    </div>

    <div class="scroll-content">
      <!-- 歌曲信息 -->
      <div class="box">
        <div class="box-title">1. 曲目信息</div>
        <div class="form-item">
          <label>曲名 (Title)</label>
          <input type="text" id="meta-title" value="New Song">
        </div>
        <div class="form-item">
          <label>曲师 (Artist)</label>
          <input type="text" id="meta-artist" value="Unknown Artist">
        </div>
        <div class="row">
          <div class="form-item">
            <label>BPM</label>
            <input type="number" id="meta-bpm" value="120" step="0.1">
          </div>
          <div class="form-item">
            <label>难度等级</label>
            <input type="text" id="meta-level" value="IN Lv.12">
          </div>
        </div>

        <!-- 音频文件导入 (增强兼容性) -->
        <div class="form-item" style="margin-top: 8px;">
          <label>载入音频 (MP3 / OGG / WAV)</label>
          <div class="file-upload-box">
            <button type="button" class="btn btn-blue" id="audio-select-btn" style="width: 100%; padding: 8px 0;">
              📁 点击选择音频文件
            </button>
            <input type="file" id="audio-input" accept=".mp3,.ogg,.wav,audio/*">
          </div>
          <div id="audio-filename" style="font-size: 11px; color: var(--text-dim); margin-top: 4px; word-break: break-all;">
            未选择文件
          </div>
        </div>
      </div>

      <!-- 多判定线系统 -->
      <div class="box">
        <div class="box-title">
          <span>2. 判定线管理 (<span id="line-count">1</span>)</span>
          <button class="btn btn-blue" style="padding: 2px 8px; font-size: 11px;" onclick="addNewLine()">+ 新建线</button>
        </div>
        <div class="line-list" id="line-list-container"></div>

        <div style="margin-top: 10px;">
          <div class="box-title" style="margin-bottom: 6px;">当前判定线关键帧</div>
          <div class="row">
            <button class="btn btn-gray" onclick="addCurrentLineMove()">位置移动</button>
            <button class="btn btn-gray" onclick="addCurrentLineRotate()">旋转角度</button>
          </div>
        </div>
      </div>

      <!-- 音符配置 -->
      <div class="box">
        <div class="box-title">3. 音符放置参数</div>
        <div class="row">
          <div class="form-item">
            <label>Hold 时长 (ms)</label>
            <input type="number" id="tool-holdtime" value="600" step="50">
          </div>
          <div class="form-item">
            <label>流速倍率</label>
            <input type="number" id="tool-speed" value="1.0" step="0.1">
          </div>
        </div>
        <div class="form-item" style="margin-top: 6px;">
          <label>下落方向</label>
          <select id="tool-side">
            <option value="above">上方 (正向接近判定线)</option>
            <option value="below">下方 (反向接近判定线)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 底部导出 -->
    <div class="bottom-status">
      <button class="btn btn-green" style="width: 100%; padding: 9px 0;" onclick="exportPackage()">
        导出谱面与配置文件 (chart & info)
      </button>
    </div>
  </div>

  <!-- 右侧主舞台区 -->
  <div class="workspace">
    <!-- 顶部控制条 -->
    <div class="top-toolbar">
      <div class="transport">
        <button class="btn btn-blue" id="play-btn" onclick="togglePlay()">播放 (空格)</button>
        <button class="btn btn-gray" onclick="seekTo(0)">回起点</button>
        <div class="timer" id="time-display">00:00.000</div>
      </div>

      <!-- 音符类型切换 -->
      <div class="note-selector">
        <span style="font-size: 12px; color: var(--text-dim); margin-right: 4px;">音符类型:</span>
        <div class="note-tab active" data-type="tap">TAP (单点)</div>
        <div class="note-tab" data-type="drag">DRAG (滑锁)</div>
        <div class="note-tab" data-type="hold">HOLD (长按)</div>
        <div class="note-tab" data-type="flick">FLICK (粉滑)</div>
      </div>

      <!-- 节拍吸附 -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: var(--text-dim);">吸附对齐:</span>
        <select id="grid-snap" style="width: 76px;">
          <option value="4">1/4 拍</option>
          <option value="8" selected>1/8 拍</option>
          <option value="16">1/16 拍</option>
        </select>
      </div>
    </div>

    <!-- 主画布 -->
    <canvas id="stage-canvas"></canvas>

    <!-- 底部时间轴 -->
    <div class="timeline-wrap" id="timeline-scroll">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>

  <script>
    /**
     * PHIRA PRO JR 谱面制作核心逻辑
     */
    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;
    let isPlaying = false;
    let startTime = 0;
    let pauseTime = 0;
    let currentMs = 0;

    const stageCanvas = document.getElementById('stage-canvas');
    const stageCtx = stageCanvas.getContext('2d');
    const tlCanvas = document.getElementById('timeline-canvas');
    const tlCtx = tlCanvas.getContext('2d');

    let stageW = (stageCanvas.width = stageCanvas.clientWidth);
    let stageH = (stageCanvas.height = stageCanvas.clientHeight);

    window.addEventListener('resize', () => {
      stageW = stageCanvas.width = stageCanvas.clientWidth;
      stageH = stageCanvas.height = stageCanvas.clientHeight;
      drawTimeline();
    });

    // 音符类型工具选择
    let selectedType = 'tap';
    document.querySelectorAll('.note-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.note-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        selectedType = tab.getAttribute('data-type');
      });
    });

    // 谱面数据结构
    const chart = {
      offset: 0,
      lines: [
        {
          id: 0,
          name: "判定线 1",
          moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
          rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
          alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
          notes: []
        }
      ]
    };

    let activeLineIndex = 0;

    /**
     * 1. 判定线管理
     */
    function renderLineList() {
      const container = document.getElementById('line-list-container');
      container.innerHTML = '';
      document.getElementById('line-count').innerText = chart.lines.length;

      chart.lines.forEach((line, idx) => {
        const item = document.createElement('div');
        item.className = `line-item ${idx === activeLineIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span>${line.name} (${line.notes.length} 音符)</span>
          ${chart.lines.length > 1 ? `<span style="color:#ff7b72; font-size:11px; cursor:pointer;" onclick="deleteLine(event, ${idx})">删除</span>` : ''}
        `;
        item.addEventListener('click', () => {
          activeLineIndex = idx;
          renderLineList();
          drawTimeline();
        });
        container.appendChild(item);
      });
    }

    function addNewLine() {
      const newId = chart.lines.length;
      chart.lines.push({
        id: newId,
        name: `判定线 ${newId + 1}`,
        moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
        rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
        alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
        notes: []
      });
      activeLineIndex = newId;
      renderLineList();
      drawTimeline();
    }

    function deleteLine(e, idx) {
      e.stopPropagation();
      if (chart.lines.length <= 1) return;
      chart.lines.splice(idx, 1);
      if (activeLineIndex >= chart.lines.length) {
        activeLineIndex = chart.lines.length - 1;
      }
      renderLineList();
      drawTimeline();
    }

    function addCurrentLineRotate() {
      const line = chart.lines[activeLineIndex];
      const angle = prompt('请输入旋转目标角度 (度):', '45');
      if (angle === null) return;
      line.rotateEvents.push({
        startTime: Math.round(currentMs),
        endTime: Math.round(currentMs + 1000),
        startAngle: 0,
        endAngle: parseFloat(angle) || 0
      });
    }

    function addCurrentLineMove() {
      const line = chart.lines[activeLineIndex];
      line.moveEvents.push({
        startTime: Math.round(currentMs),
        endTime: Math.round(currentMs + 1000),
        startX: 0.5,
        startY: 0.5,
        endX: 0.5,
        endY: 0.35
      });
    }

    /**
     * 2. 音频文件读取与解码
     */
    document.getElementById('audio-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const statusLabel = document.getElementById('audio-filename');
      statusLabel.innerText = `正在读取与解码: ${file.name} ...`;
      statusLabel.style.color = '#ffe57f';

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        const arrayBuffer = await file.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        pauseTime = 0;
        currentMs = 0;
        if (isPlaying) pauseAudio();

        setupTimelineCanvas();
        drawTimeline();

        statusLabel.innerText = `✓ 已就绪: ${file.name} (${audioBuffer.duration.toFixed(1)}s)`;
        statusLabel.style.color = '#56d364';
        document.getElementById('audio-select-btn').innerText = '已载入音频 (点击更换)';
      } catch (err) {
        console.error('音频解码失败:', err);
        statusLabel.innerText = `❌ 加载失败: ${err.message || '文件格式不支持'}`;
        statusLabel.style.color = '#ff7b72';
        alert('音频加载失败，请选择标准 MP3、OGG 或 WAV 格式文件。');
      }
    });

    function setupTimelineCanvas() {
      if (!audioBuffer) return;
      const duration = audioBuffer.duration;
      tlCanvas.width = Math.max(window.innerWidth, duration * 100);
      tlCanvas.height = 120;
    }

    function togglePlay() {
      if (!audioBuffer) {
        alert('请先载入音频文件！');
        return;
      }
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      audioSource = audioCtx.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.connect(audioCtx.destination);
      startTime = audioCtx.currentTime - (pauseTime / 1000);
      audioSource.start(0, pauseTime / 1000);
      isPlaying = true;
      document.getElementById('play-btn').innerText = '暂停 (空格)';
    }

    function pauseAudio() {
      if (audioSource) {
        try { audioSource.stop(); } catch(e) {}
      }
      pauseTime = (audioCtx.currentTime - startTime) * 1000;
      isPlaying = false;
      document.getElementById('play-btn').innerText = '播放 (空格)';
    }

    function seekTo(ms) {
      const wasPlaying = isPlaying;
      if (isPlaying) pauseAudio();
      pauseTime = Math.max(0, ms);
      currentMs = pauseTime;
      if (wasPlaying) playAudio();
      updateTimelineScroll();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        togglePlay();
      }
    });

    /**
     * 3. 判定线几何插值
     */
    function interpolate(t, sT, eT, sV, eV) {
      if (t <= sT) return sV;
      if (t >= eT) return eV;
      return sV + (eV - sV) * ((t - sT) / (eT - sT));
    }

    function getLineState(line, ms) {
      let x = 0.5, y = 0.5;
      for (const ev of line.moveEvents) {
        if (ms >= ev.startTime && ms <= ev.endTime) {
          x = interpolate(ms, ev.startTime, ev.endTime, ev.startX, ev.endX);
          y = interpolate(ms, ev.startTime, ev.endTime, ev.startY, ev.endY);
          break;
        } else if (ms > ev.endTime) {
          x = ev.endX; y = ev.endY;
        }
      }
      let angle = 0;
      for (const ev of line.rotateEvents) {
        if (ms >= ev.startTime && ms <= ev.endTime) {
          angle = interpolate(ms, ev.startTime, ev.endTime, ev.startAngle, ev.endAngle);
          break;
        } else if (ms > ev.endTime) {
          angle = ev.endAngle;
        }
      }
      let alpha = 1.0;
      for (const ev of line.alphaEvents) {
        if (ms >= ev.startTime && ms <= ev.endTime) {
          alpha = interpolate(ms, ev.startTime, ev.endTime, ev.startAlpha, ev.endAlpha);
          break;
        } else if (ms > ev.endTime) {
          alpha = ev.endAlpha;
        }
      }
      return { x: x * stageW, y: y * stageH, angle, alpha };
    }

    /**
     * 4. 舞台画布点击下音符
     */
    stageCanvas.addEventListener('mousedown', (e) => {
      const rect = stageCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const activeLine = chart.lines[activeLineIndex];
      const state = getLineState(activeLine, currentMs);
      const rad = (-state.angle * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);

      const dx = clickX - state.x;
      const dy = clickY - state.y;
      const localX = dx * cos - dy * sin;

      const holdTime = parseInt(document.getElementById('tool-holdtime').value) || 0;
      const speed = parseFloat(document.getElementById('tool-speed').value) || 1.0;
      const isAbove = document.getElementById('tool-side').value === 'above';

      const snapFraction = parseInt(document.getElementById('grid-snap').value);
      const bpm = parseFloat(document.getElementById('meta-bpm').value) || 120;
      const beatMs = (60000 / bpm) / (snapFraction / 4);
      const snappedTime = Math.round(currentMs / beatMs) * beatMs;

      const note = {
        type: selectedType,
        time: Math.round(snappedTime),
        posX: Math.round(localX),
        speed: speed,
        isAbove: isAbove
      };
      if (selectedType === 'hold') note.holdTime = holdTime;

      activeLine.notes.push(note);
      renderLineList();
      drawTimeline();
    });

    /**
     * 5. 渲染循环
     */
    function renderStudio() {
      if (isPlaying) {
        currentMs = (audioCtx.currentTime - startTime) * 1000;
        updateTimelineScroll();
      }

      const totalSec = Math.floor(currentMs / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      const ms = Math.floor(currentMs % 1000).toString().padStart(3, '0');
      document.getElementById('time-display').innerText = `${m}:${s}.${ms}`;

      stageCtx.clearRect(0, 0, stageW, stageH);

      chart.lines.forEach((line, idx) => {
        const state = getLineState(line, currentMs);
        const isActive = (idx === activeLineIndex);

        stageCtx.save();
        stageCtx.translate(state.x, state.y);
        stageCtx.rotate((state.angle * Math.PI) / 180);
        stageCtx.globalAlpha = state.alpha;

        // 判定线本体
        stageCtx.strokeStyle = isActive ? '#ffffff' : 'rgba(255, 255, 255, 0.4)';
        stageCtx.lineWidth = isActive ? 3.5 : 2;
        stageCtx.beginPath();
        stageCtx.moveTo(-stageW * 2, 0);
        stageCtx.lineTo(stageW * 2, 0);
        stageCtx.stroke();

        stageCtx.font = '11px sans-serif';
        stageCtx.fillStyle = isActive ? '#58a6ff' : 'rgba(255, 255, 255, 0.3)';
        stageCtx.fillText(line.name, 10, -8);

        // 渲染线上音符
        line.notes.forEach(note => {
          const dt = note.time - currentMs;
          const side = note.isAbove ? -1 : 1;
          const speedFactor = note.speed * (stageH * 0.0012);
          const yOffset = dt * speedFactor * side;

          if (Math.abs(yOffset) < stageH * 1.4) {
            drawNote(stageCtx, note.posX, yOffset, note, side);
          }
        });

        stageCtx.restore();
      });

      requestAnimationFrame(renderStudio);
    }
    requestAnimationFrame(renderStudio);

    function drawNote(ctx, x, y, note, side) {
      const nw = 68;
      const nh = 8;
      ctx.save();
      ctx.translate(x, y);

      switch (note.type) {
        case 'tap':
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          ctx.strokeStyle = '#ffffff';
          ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'drag':
          ctx.fillStyle = '#ffe57f';
          ctx.beginPath();
          ctx.moveTo(0, -nh * 1.3);
          ctx.lineTo(nw * 0.3, 0);
          ctx.lineTo(0, nh * 1.3);
          ctx.lineTo(-nw * 0.3, 0);
          ctx.closePath();
          ctx.fill();
          break;
        case 'hold':
          const holdLength = (note.holdTime * note.speed * (stageH * 0.0012)) * -side;
          ctx.fillStyle = 'rgba(86, 211, 100, 0.45)';
          ctx.fillRect(-nw / 2, 0, nw, holdLength);
          ctx.fillStyle = '#56d364';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'flick':
          ctx.fillStyle = '#ff7b72';
          ctx.beginPath();
          ctx.moveTo(-nw / 2, nh);
          ctx.lineTo(0, -nh);
          ctx.lineTo(nw / 2, nh);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    /**
     * 6. 底部时间轴
     */
    function drawTimeline() {
      if (!tlCanvas.width) return;
      tlCtx.clearRect(0, 0, tlCanvas.width, tlCanvas.height);

      const bpm = parseFloat(document.getElementById('meta-bpm').value) || 120;
      const beatPx = (60 / bpm) * 100;

      tlCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      for (let x = 0; x < tlCanvas.width; x += beatPx) {
        tlCtx.beginPath();
        tlCtx.moveTo(x, 0);
        tlCtx.lineTo(x, tlCanvas.height);
        tlCtx.stroke();
      }

      chart.lines.forEach((line, lIdx) => {
        const isActive = (lIdx === activeLineIndex);
        line.notes.forEach(note => {
          const x = (note.time / 1000) * 100;
          let color = '#79c0ff';
          if (note.type === 'drag') color = '#ffe57f';
          if (note.type === 'hold') color = '#56d364';
          if (note.type === 'flick') color = '#ff7b72';

          tlCtx.fillStyle = color;
          tlCtx.globalAlpha = isActive ? 1.0 : 0.25;
          tlCtx.fillRect(x - 2.5, 20, 5, tlCanvas.height - 40);
        });
      });
      tlCtx.globalAlpha = 1.0;
    }

    function updateTimelineScroll() {
      const scrollPos = (currentMs / 1000) * 100 - (window.innerWidth / 2);
      document.getElementById('timeline-scroll').scrollLeft = Math.max(0, scrollPos);
    }

    tlCanvas.addEventListener('click', (e) => {
      const rect = tlCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      seekTo((clickX / 100) * 1000);
    });

    /**
     * 7. 导出 chart.json 和 info.json
     */
    function exportPackage() {
      chart.lines.forEach(l => l.notes.sort((a, b) => a.time - b.time));

      const chartData = JSON.stringify(chart, null, 2);
      const infoData = JSON.stringify({
        title: document.getElementById('meta-title').value,
        artist: document.getElementById('meta-artist').value,
        bpm: parseFloat(document.getElementById('meta-bpm').value),
        difficulty: document.getElementById('meta-level').value,
        chart: "chart.json",
        audio: "audio.mp3",
        bg: "bg.jpg"
      }, null, 2);

      download(chartData, 'chart.json', 'application/json');
      setTimeout(() => download(infoData, 'info.json', 'application/json'), 300);
    }

    function download(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    renderLineList();
  </script>
</body>
</html>
