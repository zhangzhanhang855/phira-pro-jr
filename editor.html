<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phira Pro JR - 實時錄製與整譜編輯器</title>
  <style>
    :root {
      --bg: #090d13;
      --panel: #131923;
      --card: #1c2433;
      --border: #2d3748;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --green: #10b981;
      --green-hover: #059669;
      --red: #ef4444;
      --red-hover: #dc2626;
      --tap-c: #38bdf8;
      --drag-c: #facc15;
      --hold-c: #4ade80;
      --flick-c: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      overflow: hidden;
    }

    /* 頂部常駐導航列 (按鈕極其醒目) */
    .header-nav {
      height: 60px;
      background: var(--panel);
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .transport-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .time-badge {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: #000;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      min-width: 110px;
      text-align: center;
    }

    .btn {
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-export {
      background: var(--green);
      color: #fff;
      border-color: #34d399;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
    }
    .btn-export:hover { background: var(--green-hover); }

    .btn-record {
      background: var(--red);
      color: #fff;
      border-color: #f87171;
    }
    .btn-record.recording {
      animation: pulse 1s infinite alternate;
      background: #991b1b;
    }
    @keyframes pulse {
      from { box-shadow: 0 0 5px var(--red); }
      to { box-shadow: 0 0 25px var(--red); }
    }

    .btn-blue { background: #0284c7; color: #fff; }
    .btn-blue:hover { background: #0369a1; }
    .btn-dark { background: var(--card); color: var(--text); border-color: var(--border); }
    .btn-dark:hover { background: #283347; }

    /* 主工作區 (左側即時預覽，右側整譜編輯器) */
    .main-content {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左側舞台畫布 */
    .stage-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #05070a;
    }
    #stage-canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .stage-hint {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--accent);
      pointer-events: none;
    }

    /* 右側整譜編輯抽屜 (停止錄製後自動高亮展開) */
    .editor-drawer {
      width: 460px;
      background: var(--panel);
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    .drawer-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .drawer-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .note-counter {
      font-size: 12px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 12px;
    }

    /* 整譜表格列表 */
    .table-header {
      display: grid;
      grid-template-columns: 75px 85px 85px 75px 1fr;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      background: #0f141d;
    }
    .note-table-scroll {
      flex: 1;
      overflow-y: auto;
    }
    .note-row {
      display: grid;
      grid-template-columns: 75px 85px 85px 75px 1fr;
      padding: 8px 14px;
      font-size: 12px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.15s;
    }
    .note-row:hover, .note-row.active {
      background: rgba(56, 189, 248, 0.08);
    }

    select.cell-input, input.cell-input {
      background: #090d13;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
      outline: none;
    }
    select.cell-input:focus, input.cell-input:focus {
      border-color: var(--accent);
    }

    /* 底部時間軌道 */
    .timeline-bar {
      height: 100px;
      background: #0f141d;
      border-top: 2px solid var(--border);
      position: relative;
      overflow-x: scroll;
      overflow-y: hidden;
    }
    #timeline-canvas {
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <audio id="html5-audio" preload="auto"></audio>

  <!-- 頂部常駐操作列 (導出按鈕始終在右上方醒目位置) -->
  <header class="header-nav">
    <div class="brand">
      <h1>PHIRA PRO JR</h1>
      <label class="btn btn-dark" style="font-size:12px; padding:6px 12px; cursor:pointer;">
        📁 載入音頻
        <input type="file" id="audio-input" accept=".mp3,.ogg,.wav,audio/*" style="display:none;">
      </label>
      <span id="audio-status" style="font-size:12px; color:var(--text-dim);">未載入音頻 (可直接打節奏)</span>
    </div>

    <div class="transport-bar">
      <!-- 錄製主按鈕 -->
      <button class="btn btn-record" id="record-btn" onclick="toggleRecordMode()">
        ⏺ 開始跟節奏打一遍
      </button>

      <button class="btn btn-dark" onclick="togglePlay()">播放 / 暫停 (空格)</button>
      <button class="btn btn-dark" onclick="seekTo(0)">回起點</button>
      <div class="time-badge" id="time-display">00:00.000</div>

      <!-- 判定線切換 -->
      <select id="active-line-select" class="btn btn-dark" onchange="changeActiveLine(this.value)">
        <option value="0">判定線 1</option>
      </select>
      <button class="btn btn-dark" onclick="addNewLine()">+ 新增線</button>

      <!-- 永久醒目的導出配置按鈕 -->
      <button class="btn btn-export" onclick="exportPackage()">
        ⬇ 導出配置 (chart & info)
      </button>
    </div>
  </header>

  <!-- 主工作視圖 -->
  <main class="main-content">
    <!-- 左側畫布 -->
    <div class="stage-section">
      <div class="stage-hint" id="stage-hint">
        提示: 點擊「開始跟節奏打一遍」，在音樂播放時於白線上點擊 (或按鍵盤 D / F / J / K)
      </div>
      <canvas id="stage-canvas"></canvas>
    </div>

    <!-- 右側整譜編輯器 (停止錄製後自動展現全部音符以供修改) -->
    <aside class="editor-drawer" id="editor-drawer">
      <div class="drawer-header">
        <div>
          <span class="drawer-title">整譜音符編輯器</span>
          <span class="note-counter" id="note-count-badge">0 個音符</span>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-dark" style="font-size:11px; padding:4px 8px;" onclick="batchSortNotes()">時間排序</button>
          <button class="btn btn-dark" style="font-size:11px; padding:4px 8px; color:#f87171;" onclick="clearAllNotes()">清空全譜</button>
        </div>
      </div>

      <div class="table-header">
        <span>時間(ms)</span>
        <span>音符類型</span>
        <span>X座標</span>
        <span>所屬線</span>
        <span>操作</span>
      </div>

      <div class="note-table-scroll" id="note-table-body">
        <!-- 音符列將自動注入此處 -->
      </div>
    </aside>
  </main>

  <!-- 底部時間軌道 -->
  <div class="timeline-bar" id="timeline-scroll">
    <canvas id="timeline-canvas"></canvas>
  </div>

  <script>
    /**
     * PHIRA PRO JR 兩階段制譜引擎
     */
    const audioElem = document.getElementById('html5-audio');
    let audioDuration = 180;
    let isPlaying = false;
    let isRecording = false;
    let currentMs = 0;
    let selectedNoteIndex = -1;

    const stageCanvas = document.getElementById('stage-canvas');
    const stageCtx = stageCanvas.getContext('2d');
    const tlCanvas = document.getElementById('timeline-canvas');
    const tlCtx = tlCanvas.getContext('2d');

    let stageW = (stageCanvas.width = stageCanvas.clientWidth);
    let stageH = (stageCanvas.height = stageCanvas.clientHeight);

    window.addEventListener('resize', () => {
      stageW = stageCanvas.width = stageCanvas.clientWidth;
      stageH = stageCanvas.height = stageCanvas.clientHeight;
      drawTimeline();
    });

    // 譜面數據
    const chart = {
      offset: 0,
      lines: [
        {
          id: 0,
          name: "判定線 1",
          moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
          rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
          alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
          notes: []
        }
      ]
    };
    let activeLineIndex = 0;

    /**
     * 1. 音訊載入
     */
    document.getElementById('audio-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const label = document.getElementById('audio-status');
      label.innerText = `正在讀取: ${file.name}...`;
      label.style.color = '#facc15';

      audioElem.src = URL.createObjectURL(file);
      audioElem.onloadedmetadata = () => {
        audioDuration = audioElem.duration || 180;
        label.innerText = `✓ 已載入: ${file.name} (${audioDuration.toFixed(1)}s)`;
        label.style.color = '#4ade80';
        setupTimeline();
      };
      audioElem.onerror = () => {
        label.innerText = `✓ 已載入備用引擎: ${file.name}`;
        label.style.color = '#4ade80';
        setupTimeline();
      };
    });

    function setupTimeline() {
      tlCanvas.width = Math.max(window.innerWidth, audioDuration * 100);
      tlCanvas.height = 100;
      drawTimeline();
    }

    /**
     * 2. 錄製模式切換 (核芯流程: 打一遍 -> 停止後直接展現整譜編輯)
     */
    function toggleRecordMode() {
      const btn = document.getElementById('record-btn');
      const hint = document.getElementById('stage-hint');

      if (!isRecording) {
        // 進入錄製
        isRecording = true;
        btn.classList.add('recording');
        btn.innerText = '⏹ 停止錄製 (進入整譜編輯)';
        hint.innerText = '● 正在錄製節奏中！請直接在判定線上敲擊，或按 D / F / J / K 鍵';
        hint.style.color = '#f87171';
        playAudio();
      } else {
        // 停止錄製，自動將譜面呈現在右側供修改
        isRecording = false;
        btn.classList.remove('recording');
        btn.innerText = '⏺ 開始跟節奏打一遍';
        hint.innerText = '✓ 錄製完畢！右側已列出完整譜面表格，可隨時修改類型、微調時間與位置';
        hint.style.color = '#38bdf8';
        pauseAudio();
        renderNoteTable(); // 立即渲染整譜表格
      }
    }

    function togglePlay() {
      if (isPlaying) pauseAudio();
      else playAudio();
    }

    function playAudio() {
      if (audioElem.src) {
        audioElem.currentTime = currentMs / 1000;
        audioElem.play().catch(() => {});
      }
      isPlaying = true;
      lastTime = performance.now();
    }

    function pauseAudio() {
      if (audioElem.src) audioElem.pause();
      isPlaying = false;
      renderNoteTable();
    }

    function seekTo(ms) {
      currentMs = Math.max(0, ms);
      if (audioElem.src) audioElem.currentTime = currentMs / 1000;
      updateTimelineScroll();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        togglePlay();
      }

      // 錄製模式快捷打擊鍵
      if (isPlaying && ['KeyD', 'KeyF', 'KeyJ', 'KeyK'].includes(e.code)) {
        const laneOffsets = { KeyD: -220, KeyF: -70, KeyJ: 70, KeyK: 220 };
        recordHit(laneOffsets[e.code]);
      }
    });

    /**
     * 3. 實時敲擊記錄音符
     */
    function recordHit(localX) {
      const line = chart.lines[activeLineIndex] || chart.lines[0];
      const newNote = {
        type: 'tap',
        time: Math.round(currentMs),
        posX: Math.round(localX),
        speed: 1.0,
        isAbove: true
      };

      line.notes.push(newNote);
      drawTimeline();
      updateNoteCount();
    }

    // 點擊畫布上的判定線打擊
    stageCanvas.addEventListener('mousedown', (e) => {
      const rect = stageCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const localX = clickX - (stageW * 0.5);

      if (isPlaying || isRecording) {
        recordHit(localX);
      }
    });

    /**
     * 4. 整譜表格編輯器 (核芯交互: 錄完後整齊羅列所有音符，隨時改)
     */
    function renderNoteTable() {
      const body = document.getElementById('note-table-body');
      body.innerHTML = '';

      // 匯總所有判定線的音符
      const allNotes = [];
      chart.lines.forEach((line, lIdx) => {
        line.notes.forEach((note, nIdx) => {
          allNotes.push({ ...note, lineIndex: lIdx, noteIndex: nIdx });
        });
      });

      // 依時間先後排序顯示
      allNotes.sort((a, b) => a.time - b.time);
      updateNoteCount();

      if (allNotes.length === 0) {
        body.innerHTML = `
          <div style="padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px;">
            尚未錄製任何音符。<br>點擊上方「開始跟節奏打一遍」試聽並敲擊錄製！
          </div>
        `;
        return;
      }

      allNotes.forEach((noteItem, idx) => {
        const row = document.createElement('div');
        row.className = `note-row ${idx === selectedNoteIndex ? 'active' : ''}`;
        row.innerHTML = `
          <div>
            <input type="number" class="cell-input" value="${noteItem.time}" step="10" 
              onchange="modifyNoteTime(${noteItem.lineIndex}, ${noteItem.noteIndex}, this.value)">
          </div>
          <div>
            <select class="cell-input" onchange="modifyNoteType(${noteItem.lineIndex}, ${noteItem.noteIndex}, this.value)">
              <option value="tap" ${noteItem.type==='tap'?'selected':''}>TAP(藍)</option>
              <option value="drag" ${noteItem.type==='drag'?'selected':''}>DRAG(金)</option>
              <option value="hold" ${noteItem.type==='hold'?'selected':''}>HOLD(長)</option>
              <option value="flick" ${noteItem.type==='flick'?'selected':''}>FLICK(紅)</option>
            </select>
          </div>
          <div>
            <input type="number" class="cell-input" value="${noteItem.posX}" step="10" min="-450" max="450"
              onchange="modifyNotePos(${noteItem.lineIndex}, ${noteItem.noteIndex}, this.value)">
          </div>
          <div>
            <select class="cell-input" onchange="modifyNoteLine(${noteItem.lineIndex}, ${noteItem.noteIndex}, this.value)">
              ${chart.lines.map((l, lI) => `<option value="${lI}" ${lI===noteItem.lineIndex?'selected':''}>線 ${lI+1}</option>`).join('')}
            </select>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-dark" style="padding:2px 6px; font-size:11px;" onclick="jumpToNote(${noteItem.time})">定位</button>
            <button class="btn btn-dark" style="padding:2px 6px; font-size:11px; color:#f87171;" onclick="deleteSingleNote(${noteItem.lineIndex}, ${noteItem.noteIndex})">刪除</button>
          </div>
        `;
        body.appendChild(row);
      });
    }

    function modifyNoteTime(lIdx, nIdx, newTime) {
      chart.lines[lIdx].notes[nIdx].time = parseInt(newTime) || 0;
      drawTimeline();
    }

    function modifyNoteType(lIdx, nIdx, newType) {
      const note = chart.lines[lIdx].notes[nIdx];
      note.type = newType;
      if (newType === 'hold' && !note.holdTime) note.holdTime = 600;
      drawTimeline();
    }

    function modifyNotePos(lIdx, nIdx, newPos) {
      chart.lines[lIdx].notes[nIdx].posX = parseInt(newPos) || 0;
      drawTimeline();
    }

    function modifyNoteLine(fromLine, nIdx, toLine) {
      toLine = parseInt(toLine);
      if (fromLine === toLine) return;
      const note = chart.lines[fromLine].notes.splice(nIdx, 1)[0];
      chart.lines[toLine].notes.push(note);
      renderNoteTable();
      drawTimeline();
    }

    function deleteSingleNote(lIdx, nIdx) {
      chart.lines[lIdx].notes.splice(nIdx, 1);
      renderNoteTable();
      drawTimeline();
    }

    function jumpToNote(timeMs) {
      seekTo(timeMs);
    }

    function batchSortNotes() {
      chart.lines.forEach(line => line.notes.sort((a, b) => a.time - b.time));
      renderNoteTable();
      drawTimeline();
    }

    function clearAllNotes() {
      if (!confirm('確定清空所有已錄製音符嗎？')) return;
      chart.lines.forEach(line => line.notes = []);
      renderNoteTable();
      drawTimeline();
    }

    function updateNoteCount() {
      let count = 0;
      chart.lines.forEach(l => count += l.notes.length);
      document.getElementById('note-count-badge').innerText = `${count} 個音符`;
    }

    /**
     * 5. 判定線管理
     */
    function addNewLine() {
      const newId = chart.lines.length;
      chart.lines.push({
        id: newId,
        name: `判定線 ${newId + 1}`,
        moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
        rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
        alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
        notes: []
      });

      const select = document.getElementById('active-line-select');
      const opt = document.createElement('option');
      opt.value = newId;
      opt.innerText = `判定線 ${newId + 1}`;
      select.appendChild(opt);
      select.value = newId;
      activeLineIndex = newId;

      renderNoteTable();
      drawTimeline();
    }

    function changeActiveLine(val) {
      activeLineIndex = parseInt(val) || 0;
    }

    /**
     * 6. 渲染引擎與主動畫循環
     */
    let lastTime = performance.now();

    function renderLoop(now) {
      const delta = now - lastTime;
      lastTime = now;

      if (isPlaying) {
        if (audioElem.src && !audioElem.paused) {
          currentMs = audioElem.currentTime * 1000;
        } else {
          currentMs += delta;
        }
        updateTimelineScroll();
      }

      // 時間碼展示
      const totalSec = Math.floor(currentMs / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      const ms = Math.floor(currentMs % 1000).toString().padStart(3, '0');
      document.getElementById('time-display').innerText = `${m}:${s}.${ms}`;

      stageCtx.clearRect(0, 0, stageW, stageH);

      const lineY = stageH * 0.5;

      // 繪製判定線與接近音符
      chart.lines.forEach((line, idx) => {
        const isActive = (idx === activeLineIndex);

        stageCtx.save();
        stageCtx.translate(stageW * 0.5, lineY);

        // 判定線本體
        stageCtx.strokeStyle = isActive ? '#ffffff' : 'rgba(255, 255, 255, 0.25)';
        stageCtx.lineWidth = isActive ? 3.5 : 2;
        stageCtx.beginPath();
        stageCtx.moveTo(-stageW, 0);
        stageCtx.lineTo(stageW, 0);
        stageCtx.stroke();

        stageCtx.font = '12px sans-serif';
        stageCtx.fillStyle = isActive ? '#38bdf8' : 'rgba(255, 255, 255, 0.4)';
        stageCtx.fillText(`${line.name}`, -stageW * 0.45, -12);

        // 繪製線上音符
        line.notes.forEach(note => {
          const dt = note.time - currentMs;
          const yOffset = dt * (note.speed * (stageH * 0.0012)) * (note.isAbove ? -1 : 1);

          if (Math.abs(yOffset) < stageH * 1.5) {
            drawNote(stageCtx, note.posX, yOffset, note);
          }
        });

        stageCtx.restore();
      });

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function drawNote(ctx, x, y, note) {
      const nw = 70;
      const nh = 8;
      ctx.save();
      ctx.translate(x, y);

      switch (note.type) {
        case 'tap':
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          ctx.strokeStyle = '#ffffff';
          ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'drag':
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.moveTo(0, -nh * 1.3);
          ctx.lineTo(nw * 0.35, 0);
          ctx.lineTo(0, nh * 1.3);
          ctx.lineTo(-nw * 0.35, 0);
          ctx.closePath();
          ctx.fill();
          break;
        case 'hold':
          const holdLen = (note.holdTime * note.speed * (stageH * 0.0012)) * -1;
          ctx.fillStyle = 'rgba(74, 222, 128, 0.4)';
          ctx.fillRect(-nw / 2, 0, nw, holdLen);
          ctx.fillStyle = '#4ade80';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'flick':
          ctx.fillStyle = '#f87171';
          ctx.beginPath();
          ctx.moveTo(-nw / 2, nh);
          ctx.lineTo(0, -nh);
          ctx.lineTo(nw / 2, nh);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    /**
     * 7. 底部時間軸
     */
    function drawTimeline() {
      if (!tlCanvas.width) return;
      tlCtx.clearRect(0, 0, tlCanvas.width, tlCanvas.height);

      tlCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      for (let x = 0; x < tlCanvas.width; x += 50) {
        tlCtx.beginPath();
        tlCtx.moveTo(x, 0);
        tlCtx.lineTo(x, tlCanvas.height);
        tlCtx.stroke();
      }

      chart.lines.forEach(line => {
        line.notes.forEach(note => {
          const x = (note.time / 1000) * 100;
          let color = '#38bdf8';
          if (note.type === 'drag') color = '#facc15';
          if (note.type === 'hold') color = '#4ade80';
          if (note.type === 'flick') color = '#f87171';

          tlCtx.fillStyle = color;
          tlCtx.fillRect(x - 2, 15, 4, tlCanvas.height - 30);
        });
      });
    }

    function updateTimelineScroll() {
      const scrollPos = (currentMs / 1000) * 100 - (window.innerWidth / 2);
      document.getElementById('timeline-scroll').scrollLeft = Math.max(0, scrollPos);
    }

    tlCanvas.addEventListener('click', (e) => {
      const rect = tlCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      seekTo((clickX / 100) * 1000);
    });

    /**
     * 8. 導出配置 (右上角綠色按鈕觸發)
     */
    function exportPackage() {
      batchSortNotes();

      const chartData = JSON.stringify(chart, null, 2);
      const infoData = JSON.stringify({
        title: "JR Masterpiece",
        artist: "JR Artist",
        bpm: 120,
        difficulty: "IN Lv.12",
        chart: "chart.json",
        audio: "audio.mp3",
        bg: "bg.jpg"
      }, null, 2);

      downloadFile(chartData, 'chart.json', 'application/json');
      setTimeout(() => {
        downloadFile(infoData, 'info.json', 'application/json');
      }, 300);
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // 初始化
    setupTimeline();
    renderNoteTable();
  </script>
</body>
</html>
