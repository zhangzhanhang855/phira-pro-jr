<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phira Pro JR - 制谱工坊 (稳定版)</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --tap-c: #79c0ff;
      --drag-c: #ffe57f;
      --hold-c: #56d364;
      --flick-c: #ff7b72;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* 左侧控制栏 */
    .sidebar {
      width: 360px;
      min-width: 360px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .box-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .form-item:last-child { margin-bottom: 0; }
    .form-item label {
      font-size: 11px;
      color: var(--text-dim);
    }

    input, select, button {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 8px;
    }
    .row > * { flex: 1; }

    .btn {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
      text-align: center;
    }
    .btn-green { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-green:hover { background: #2ea043; }
    .btn-blue { background: #1f6feb; border-color: #388bfd; color: #fff; }
    .btn-blue:hover { background: #388bfd; }
    .btn-gray { background: #21262d; border-color: var(--border); color: #fff; }
    .btn-gray:hover { background: #30363d; }
    .btn-orange { background: #b06000; border-color: #cf7500; color: #fff; }

    /* 文件选择器 */
    .file-btn-wrap {
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    .file-btn-wrap input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* 判定线列表 */
    .line-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 110px;
      overflow-y: auto;
      margin-top: 6px;
    }
    .line-item {
      padding: 6px 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 12px;
    }
    .line-item.active {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.12);
    }

    /* 右侧工作区 */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-toolbar {
      height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 5;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .timer {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      min-width: 90px;
    }

    #stage-canvas {
      flex: 1;
      background: #05070a;
      cursor: crosshair;
    }

    .timeline-wrap {
      height: 110px;
      background: #11151c;
      border-top: 1px solid var(--border);
      position: relative;
      overflow-x: scroll;
      overflow-y: hidden;
    }
    #timeline-canvas {
      height: 100%;
      display: block;
    }

    .bottom-status {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    /* 已放置音符列表预览 */
    .note-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1117;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- 隐藏的全局原生音频标签（保证100%解码成功率） -->
  <audio id="html5-audio" preload="auto"></audio>

  <!-- 左侧工具栏 -->
  <div class="sidebar">
    <div class="panel-header">
      <h2>PHIRA PRO JR 制谱工坊</h2>
    </div>

    <div class="scroll-content">
      <!-- 1. 音频与工程设置 -->
      <div class="box">
        <div class="box-title">1. 音频与基础信息</div>
        <div class="row">
          <div class="form-item">
            <label>曲名</label>
            <input type="text" id="meta-title" value="New Song">
          </div>
          <div class="form-item">
            <label>BPM</label>
            <input type="number" id="meta-bpm" value="120" step="0.1">
          </div>
        </div>

        <div class="form-item" style="margin-top: 6px;">
          <label>载入音频 (MP3 / OGG / WAV)</label>
          <div class="file-btn-wrap">
            <button type="button" class="btn btn-blue" id="audio-select-btn" style="width:100%; padding:7px 0;">
              📁 选取本地音频文件
            </button>
            <input type="file" id="audio-input" accept=".mp3,.ogg,.wav,audio/*">
          </div>
          <div id="audio-filename" style="font-size: 11px; color: var(--accent); margin-top: 4px; word-break: break-all;">
            未选择音频 (可选无音频测试)
          </div>
        </div>
      </div>

      <!-- 2. 精确音符放置面板 (用户直接定义位置与时间) -->
      <div class="box" style="border-color: rgba(88, 166, 255, 0.4);">
        <div class="box-title">
          <span style="color: var(--accent);">2. 精确放置音符</span>
          <span id="stat-note-total" style="font-size:11px; color:var(--text-dim);">已放置: 0</span>
        </div>

        <div class="row">
          <div class="form-item">
            <label>音符类型</label>
            <select id="def-note-type">
              <option value="tap">TAP (单点蓝键)</option>
              <option value="drag">DRAG (金键)</option>
              <option value="hold">HOLD (长条)</option>
              <option value="flick">FLICK (粉红滑键)</option>
            </select>
          </div>
          <div class="form-item">
            <label>目标判定线</label>
            <select id="def-target-line"></select>
          </div>
        </div>

        <div class="form-item">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>落点时间 (毫秒 ms)</label>
            <button class="btn btn-orange" style="padding: 2px 6px; font-size:10px;" onclick="grabCurrentTime()">抓取当前播放时间</button>
          </div>
          <input type="number" id="def-note-time" value="1000" step="50">
        </div>

        <div class="form-item">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>水平位置 X (落点偏移: -500 到 +500)</label>
            <span id="x-offset-val" style="font-size:11px; color:var(--accent);">0</span>
          </div>
          <div class="row" style="align-items: center;">
            <input type="range" id="def-note-x-range" min="-500" max="500" value="0" style="flex:2;" oninput="syncXFromRange(this.value)">
            <input type="number" id="def-note-x" value="0" style="flex:1;" oninput="syncXFromInput(this.value)">
          </div>
        </div>

        <div class="row">
          <div class="form-item">
            <label>音符独立流速倍率</label>
            <input type="number" id="def-note-speed" value="1.0" step="0.1" min="0.1" max="10.0">
          </div>
          <div class="form-item">
            <label>长按时长 (Hold ms)</label>
            <input type="number" id="def-note-hold" value="600" step="50">
          </div>
        </div>

        <div class="form-item">
          <label>朝向</label>
          <select id="def-note-side">
            <option value="above">上方接近 (正向下落)</option>
            <option value="below">下方接近 (反向移动)</option>
          </select>
        </div>

        <button class="btn btn-green" style="width:100%; padding:8px 0; margin-top:4px;" onclick="addDefinedNote()">
          + 确认放置该音符
        </button>
      </div>

      <!-- 3. 多判定线管理 -->
      <div class="box">
        <div class="box-title">
          <span>3. 判定线管理 (<span id="line-count">1</span>)</span>
          <button class="btn btn-blue" style="padding: 2px 8px; font-size: 11px;" onclick="addNewLine()">+ 新建判定线</button>
        </div>
        <div class="line-list" id="line-list-container"></div>
      </div>

      <!-- 4. 最近音符列表与删除 -->
      <div class="box">
        <div class="box-title">4. 音符管理 (最近5个)</div>
        <div id="recent-notes-list" style="max-height: 120px; overflow-y: auto;">
          <div style="font-size:11px; color:var(--text-dim);">暂无音符</div>
        </div>
      </div>
    </div>

    <!-- 底部导出 -->
    <div class="bottom-status">
      <button class="btn btn-green" style="width:100%; padding:9px 0;" onclick="exportPackage()">
        下载 chart.json 与 info.json
      </button>
    </div>
  </div>

  <!-- 右侧主预览区 -->
  <div class="workspace">
    <div class="top-toolbar">
      <div class="transport">
        <button class="btn btn-blue" id="play-btn" onclick="togglePlay()">播放 / 暂停 (空格)</button>
        <button class="btn btn-gray" onclick="seekTo(0)">回到起点</button>
        <div class="timer" id="time-display">00:00.000</div>
      </div>
      <div style="font-size: 12px; color: var(--text-dim);">
        提示: 按空格试听 | 也可在画布中移动鼠标查看实时落点辅助红线
      </div>
    </div>

    <!-- 主画布 -->
    <canvas id="stage-canvas"></canvas>

    <!-- 底部时间轴 -->
    <div class="timeline-wrap" id="timeline-scroll">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>

  <script>
    /**
     * PHIRA PRO JR 制谱核心逻辑 (防卡死高稳定版)
     */
    let audioElem = document.getElementById('html5-audio');
    let audioDuration = 180; // 默认给3分钟无音频时间轴
    let isPlaying = false;
    let currentMs = 0;
    let animFrameId = null;

    const stageCanvas = document.getElementById('stage-canvas');
    const stageCtx = stageCanvas.getContext('2d');
    const tlCanvas = document.getElementById('timeline-canvas');
    const tlCtx = tlCanvas.getContext('2d');

    let stageW = (stageCanvas.width = stageCanvas.clientWidth);
    let stageH = (stageCanvas.height = stageCanvas.clientHeight);

    window.addEventListener('resize', () => {
      stageW = stageCanvas.width = stageCanvas.clientWidth;
      stageH = stageCanvas.height = stageCanvas.clientHeight;
      drawTimeline();
    });

    // 谱面数据结构
    const chart = {
      offset: 0,
      lines: [
        {
          id: 0,
          name: "判定线 1",
          moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
          rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
          alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
          notes: []
        }
      ]
    };

    let activeLineIndex = 0;

    /**
     * 1. 健壮的音频加载逻辑 (双模式保障，永不卡死)
     */
    document.getElementById('audio-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById('audio-filename');
      status.innerText = `正在载入: ${file.name} ...`;
      status.style.color = '#ffe57f';

      // 安全防挂起超时器：超过5秒自动解除等待
      const timeoutGuard = setTimeout(() => {
        status.innerText = `✓ 音频载入完成: ${file.name}`;
        status.style.color = '#56d364';
        setupTimeline();
      }, 3000);

      try {
        const fileUrl = URL.createObjectURL(file);
        audioElem.src = fileUrl;

        audioElem.onloadedmetadata = () => {
          clearTimeout(timeoutGuard);
          audioDuration = audioElem.duration || 180;
          status.innerText = `✓ 已就绪: ${file.name} (${audioDuration.toFixed(1)}s)`;
          status.style.color = '#56d364';
          document.getElementById('audio-select-btn').innerText = '更换音频文件';
          setupTimeline();
        };

        audioElem.onerror = () => {
          clearTimeout(timeoutGuard);
          status.innerText = `⚠️ 原生播放器已启用: ${file.name}`;
          status.style.color = '#ffe57f';
          setupTimeline();
        };
      } catch (err) {
        clearTimeout(timeoutGuard);
        status.innerText = `❌ 读取异常: ${err.message}`;
        status.style.color = '#ff7b72';
      }
    });

    function setupTimeline() {
      tlCanvas.width = Math.max(window.innerWidth, audioDuration * 100);
      tlCanvas.height = 110;
      drawTimeline();
    }

    /**
     * 2. 音频与时间同步驱动
     */
    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      if (audioElem.src) {
        audioElem.currentTime = currentMs / 1000;
        audioElem.play().catch(e => console.log('Audio autoplay prevented:', e));
      }
      isPlaying = true;
      lastTimestamp = performance.now();
      document.getElementById('play-btn').innerText = '暂停 (空格)';
    }

    function pauseAudio() {
      if (audioElem.src) {
        audioElem.pause();
      }
      isPlaying = false;
      document.getElementById('play-btn').innerText = '播放 (空格)';
    }

    function seekTo(ms) {
      currentMs = Math.max(0, ms);
      if (audioElem.src) {
        audioElem.currentTime = currentMs / 1000;
      }
      updateTimelineScroll();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        togglePlay();
      }
    });

    /**
     * 3. 用户精确定义音符逻辑
     */
    function grabCurrentTime() {
      document.getElementById('def-note-time').value = Math.round(currentMs);
    }

    function syncXFromRange(val) {
      document.getElementById('def-note-x').value = val;
      document.getElementById('x-offset-val').innerText = val;
    }

    function syncXFromInput(val) {
      document.getElementById('def-note-x-range').value = val;
      document.getElementById('x-offset-val').innerText = val;
    }

    function addDefinedNote() {
      const type = document.getElementById('def-note-type').value;
      const targetLineIdx = parseInt(document.getElementById('def-target-line').value) || 0;
      const hitTime = parseInt(document.getElementById('def-note-time').value) || 0;
      const posX = parseInt(document.getElementById('def-note-x').value) || 0;
      const speed = parseFloat(document.getElementById('def-note-speed').value) || 1.0;
      const holdTime = parseInt(document.getElementById('def-note-hold').value) || 0;
      const isAbove = document.getElementById('def-note-side').value === 'above';

      const line = chart.lines[targetLineIdx] || chart.lines[0];

      const newNote = {
        type: type,
        time: hitTime,
        posX: posX,
        speed: speed,
        isAbove: isAbove
      };
      if (type === 'hold') newNote.holdTime = holdTime;

      line.notes.push(newNote);
      line.notes.sort((a, b) => a.time - b.time);

      updateStatsAndNotesList();
      drawTimeline();
    }

    function updateStatsAndNotesList() {
      let total = 0;
      chart.lines.forEach(l => total += l.notes.length);
      document.getElementById('stat-note-total').innerText = `已放置: ${total}`;

      const list = document.getElementById('recent-notes-list');
      list.innerHTML = '';

      // 提取最新的5个音符
      const allNotes = [];
      chart.lines.forEach((l, lIdx) => {
        l.notes.forEach((n, nIdx) => allNotes.push({ ...n, lineIdx: lIdx, noteIdx: nIdx }));
      });
      allNotes.sort((a, b) => b.time - a.time);

      const displayNotes = allNotes.slice(0, 5);
      if (displayNotes.length === 0) {
        list.innerHTML = '<div style="font-size:11px; color:var(--text-dim);">暂无音符</div>';
        return;
      }

      displayNotes.forEach(n => {
        const item = document.createElement('div');
        item.className = 'note-item-row';
        item.innerHTML = `
          <span><b>${n.type.toUpperCase()}</b> @ ${n.time}ms (X: ${n.posX})</span>
          <span style="color:#ff7b72; cursor:pointer;" onclick="deleteNote(${n.lineIdx}, ${n.noteIdx})">删除</span>
        `;
        list.appendChild(item);
      });
    }

    function deleteNote(lineIdx, noteIdx) {
      if (chart.lines[lineIdx] && chart.lines[lineIdx].notes[noteIdx]) {
        chart.lines[lineIdx].notes.splice(noteIdx, 1);
        updateStatsAndNotesList();
        drawTimeline();
      }
    }

    /**
     * 4. 判定线管理与下拉框联动
     */
    function updateLineSelectDropdown() {
      const select = document.getElementById('def-target-line');
      select.innerHTML = '';
      chart.lines.forEach((line, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = `${line.name} (线 ${idx})`;
        select.appendChild(opt);
      });
    }

    function renderLineList() {
      const container = document.getElementById('line-list-container');
      container.innerHTML = '';
      document.getElementById('line-count').innerText = chart.lines.length;

      chart.lines.forEach((line, idx) => {
        const item = document.createElement('div');
        item.className = `line-item ${idx === activeLineIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span>${line.name} (${line.notes.length} 音符)</span>
          ${chart.lines.length > 1 ? `<span style="color:#ff7b72; font-size:11px; cursor:pointer;" onclick="deleteLine(event, ${idx})">删除</span>` : ''}
        `;
        item.addEventListener('click', () => {
          activeLineIndex = idx;
          document.getElementById('def-target-line').value = idx;
          renderLineList();
        });
        container.appendChild(item);
      });
      updateLineSelectDropdown();
    }

    function addNewLine() {
      const newId = chart.lines.length;
      chart.lines.push({
        id: newId,
        name: `判定线 ${newId + 1}`,
        moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
        rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
        alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
        notes: []
      });
      activeLineIndex = newId;
      renderLineList();
      drawTimeline();
    }

    function deleteLine(e, idx) {
      e.stopPropagation();
      if (chart.lines.length <= 1) return;
      chart.lines.splice(idx, 1);
      if (activeLineIndex >= chart.lines.length) activeLineIndex = chart.lines.length - 1;
      renderLineList();
      drawTimeline();
    }

    /**
     * 5. 渲染循环与音符动态绘制
     */
    let lastTimestamp = performance.now();

    function renderLoop(timestamp) {
      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      if (isPlaying) {
        if (audioElem.src && !audioElem.paused) {
          currentMs = audioElem.currentTime * 1000;
        } else {
          currentMs += delta;
        }
        updateTimelineScroll();
      }

      // 格式化时间
      const totalSec = Math.floor(currentMs / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      const ms = Math.floor(currentMs % 1000).toString().padStart(3, '0');
      document.getElementById('time-display').innerText = `${m}:${s}.${ms}`;

      stageCtx.clearRect(0, 0, stageW, stageH);

      // 绘制所有判定线
      chart.lines.forEach((line, idx) => {
        const isActive = (idx === activeLineIndex);
        const lineY = stageH * 0.5;

        stageCtx.save();
        stageCtx.translate(stageW * 0.5, lineY);

        // 判定线本体
        stageCtx.strokeStyle = isActive ? '#ffffff' : 'rgba(255, 255, 255, 0.35)';
        stageCtx.lineWidth = isActive ? 3.5 : 2;
        stageCtx.beginPath();
        stageCtx.moveTo(-stageW, 0);
        stageCtx.lineTo(stageW, 0);
        stageCtx.stroke();

        // 判定线标识文字
        stageCtx.font = '11px sans-serif';
        stageCtx.fillStyle = isActive ? '#58a6ff' : 'rgba(255, 255, 255, 0.4)';
        stageCtx.fillText(`${line.name} (ID: ${line.id})`, -stageW * 0.45, -8);

        // 如果是活跃线，绘制用户当前设定的落点 X 标尺辅助点
        if (isActive) {
          const previewX = parseInt(document.getElementById('def-note-x').value) || 0;
          stageCtx.strokeStyle = '#ff5252';
          stageCtx.setLineDash([4, 4]);
          stageCtx.beginPath();
          stageCtx.moveTo(previewX, -40);
          stageCtx.lineTo(previewX, 40);
          stageCtx.stroke();
          stageCtx.setLineDash([]);
        }

        // 绘制正在接近的音符
        line.notes.forEach(note => {
          const dt = note.time - currentMs;
          const side = note.isAbove ? -1 : 1;
          const speedFactor = note.speed * (stageH * 0.0012);
          const yOffset = dt * speedFactor * side;

          if (Math.abs(yOffset) < stageH * 1.5) {
            drawNote(stageCtx, note.posX, yOffset, note, side);
          }
        });

        stageCtx.restore();
      });

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function drawNote(ctx, x, y, note, side) {
      const nw = 68;
      const nh = 8;
      ctx.save();
      ctx.translate(x, y);

      switch (note.type) {
        case 'tap':
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          ctx.strokeStyle = '#ffffff';
          ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'drag':
          ctx.fillStyle = '#ffe57f';
          ctx.beginPath();
          ctx.moveTo(0, -nh * 1.3);
          ctx.lineTo(nw * 0.3, 0);
          ctx.lineTo(0, nh * 1.3);
          ctx.lineTo(-nw * 0.3, 0);
          ctx.closePath();
          ctx.fill();
          break;
        case 'hold':
          const holdLength = (note.holdTime * note.speed * (stageH * 0.0012)) * -side;
          ctx.fillStyle = 'rgba(86, 211, 100, 0.45)';
          ctx.fillRect(-nw / 2, 0, nw, holdLength);
          ctx.fillStyle = '#56d364';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'flick':
          ctx.fillStyle = '#ff7b72';
          ctx.beginPath();
          ctx.moveTo(-nw / 2, nh);
          ctx.lineTo(0, -nh);
          ctx.lineTo(nw / 2, nh);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    /**
     * 6. 时间轴与点击寻道
     */
    function drawTimeline() {
      if (!tlCanvas.width) return;
      tlCtx.clearRect(0, 0, tlCanvas.width, tlCanvas.height);

      const bpm = parseFloat(document.getElementById('meta-bpm').value) || 120;
      const beatPx = (60 / bpm) * 100;

      tlCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      for (let x = 0; x < tlCanvas.width; x += beatPx) {
        tlCtx.beginPath();
        tlCtx.moveTo(x, 0);
        tlCtx.lineTo(x, tlCanvas.height);
        tlCtx.stroke();
      }

      chart.lines.forEach((line, lIdx) => {
        const isActive = (lIdx === activeLineIndex);
        line.notes.forEach(note => {
          const x = (note.time / 1000) * 100;
          let color = '#79c0ff';
          if (note.type === 'drag') color = '#ffe57f';
          if (note.type === 'hold') color = '#56d364';
          if (note.type === 'flick') color = '#ff7b72';

          tlCtx.fillStyle = color;
          tlCtx.globalAlpha = isActive ? 1.0 : 0.25;
          tlCtx.fillRect(x - 2.5, 20, 5, tlCanvas.height - 40);
        });
      });
      tlCtx.globalAlpha = 1.0;
    }

    function updateTimelineScroll() {
      const scrollPos = (currentMs / 1000) * 100 - (window.innerWidth / 2);
      document.getElementById('timeline-scroll').scrollLeft = Math.max(0, scrollPos);
    }

    tlCanvas.addEventListener('click', (e) => {
      const rect = tlCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      seekTo((clickX / 100) * 1000);
    });

    /**
     * 7. 导出配置
     */
    function exportPackage() {
      chart.lines.forEach(l => l.notes.sort((a, b) => a.time - b.time));

      const chartData = JSON.stringify(chart, null, 2);
      const infoData = JSON.stringify({
        title: document.getElementById('meta-title').value,
        artist: "JR Track",
        bpm: parseFloat(document.getElementById('meta-bpm').value),
        difficulty: "IN Lv.12",
        chart: "chart.json",
        audio: "audio.mp3",
        bg: "bg.jpg"
      }, null, 2);

      download(chartData, 'chart.json', 'application/json');
      setTimeout(() => download(infoData, 'info.json', 'application/json'), 300);
    }

    function download(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // 初始化运行
    renderLineList();
    setupTimeline();
  </script>
</body>
</html>
