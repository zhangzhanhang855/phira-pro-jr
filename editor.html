<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phira Pro JR - 實時錄製打擊制譜器</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --tap-c: #79c0ff;
      --drag-c: #ffe57f;
      --hold-c: #56d364;
      --flick-c: #ff7b72;
      --recording: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* 左側側邊欄 */
    .sidebar {
      width: 330px;
      min-width: 330px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .box-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }
    .form-item:last-child { margin-bottom: 0; }
    .form-item label {
      font-size: 11px;
      color: var(--text-dim);
    }

    input, select, button {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 8px;
    }
    .row > * { flex: 1; }

    .btn {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
      text-align: center;
      padding: 6px 10px;
    }
    .btn-green { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-green:hover { background: #2ea043; }
    .btn-blue { background: #1f6feb; border-color: #388bfd; color: #fff; }
    .btn-blue:hover { background: #388bfd; }
    .btn-gray { background: #21262d; border-color: var(--border); color: #fff; }
    .btn-gray:hover { background: #30363d; }
    .btn-danger { background: #b62324; border-color: #d73a49; color: #fff; }
    .btn-danger:hover { background: #d73a49; }
    .btn-recording { background: var(--recording); border-color: #ff7b72; color: #fff; animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { opacity: 0.8; }
      to { opacity: 1; }
    }

    /* 判定線切換選項卡 */
    .line-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 100px;
      overflow-y: auto;
    }
    .line-item {
      padding: 6px 10px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 11px;
    }
    .line-item.active {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.15);
    }

    /* 音符檢查器面板 (Inspector) */
    .inspector-panel {
      border: 1px solid var(--accent);
      background: rgba(88, 166, 255, 0.05);
    }

    /* 右側主工作空間 */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 頂部操作列 */
    .top-toolbar {
      height: 52px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 5;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timer {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      min-width: 90px;
    }

    .mode-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #21262d;
      color: var(--text-dim);
    }
    .mode-badge.recording {
      background: rgba(248, 81, 73, 0.2);
      color: #ff7b72;
      border: 1px solid #ff7b72;
    }

    /* 主舞台 */
    #stage-canvas {
      flex: 1;
      background: #05070a;
      cursor: crosshair;
    }

    /* 底部時間軌道 */
    .timeline-wrap {
      height: 110px;
      background: #11151c;
      border-top: 1px solid var(--border);
      position: relative;
      overflow-x: scroll;
      overflow-y: hidden;
    }
    #timeline-canvas {
      height: 100%;
      display: block;
    }

    .bottom-status {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
  </style>
</head>
<body>

  <audio id="html5-audio" preload="auto"></audio>

  <!-- 左側控制面板 -->
  <div class="sidebar">
    <div class="panel-header">
      <h2>PHIRA PRO JR - 打擊錄製器</h2>
    </div>

    <div class="scroll-content">
      <!-- 1. 音訊載入 -->
      <div class="box">
        <div class="box-title">1. 曲目載入</div>
        <div class="row">
          <div class="form-item">
            <label>曲名</label>
            <input type="text" id="meta-title" value="My Track">
          </div>
          <div class="form-item">
            <label>BPM</label>
            <input type="number" id="meta-bpm" value="120" step="0.1">
          </div>
        </div>

        <div class="form-item" style="margin-top: 6px;">
          <div style="position: relative; overflow: hidden;">
            <button type="button" class="btn btn-blue" id="audio-select-btn" style="width:100%;">
              📁 選擇音頻 (MP3 / OGG)
            </button>
            <input type="file" id="audio-input" accept=".mp3,.ogg,.wav,audio/*" style="position:absolute;left:0;top:0;opacity:0;width:100%;height:100%;cursor:pointer;">
          </div>
          <div id="audio-filename" style="font-size: 11px; color: var(--accent); margin-top: 4px; word-break: break-all;">
            未選擇音頻 (可直接無音頻測試)
          </div>
        </div>
      </div>

      <!-- 2. 多判定線選擇 (打擊錄製會記錄在目前判定線上) -->
      <div class="box">
        <div class="box-title">
          <span>2. 目前錄製判定線 (<span id="line-count">1</span>)</span>
          <button class="btn btn-gray" style="padding: 2px 6px; font-size: 10px;" onclick="addNewLine()">+ 新增線</button>
        </div>
        <div class="line-list" id="line-list-container"></div>
      </div>

      <!-- 3. 音符後期修改面板 (Inspector) -->
      <div class="box inspector-panel">
        <div class="box-title">
          <span style="color: var(--accent);">3. 音符屬性編輯器</span>
          <span id="inspect-status" style="font-size: 10px; color: var(--text-dim);">未選中音符</span>
        </div>

        <div id="inspector-content" style="opacity: 0.5; pointer-events: none;">
          <div class="row">
            <div class="form-item">
              <label>類型</label>
              <select id="ins-type" onchange="updateSelectedNote()">
                <option value="tap">TAP (單點藍鍵)</option>
                <option value="drag">DRAG (金鍵)</option>
                <option value="hold">HOLD (長條)</option>
                <option value="flick">FLICK (粉滑)</option>
              </select>
            </div>
            <div class="form-item">
              <label>判定線</label>
              <select id="ins-line" onchange="updateSelectedNoteLine()"></select>
            </div>
          </div>

          <div class="form-item">
            <label>落點時間 (ms)</label>
            <input type="number" id="ins-time" step="10" onchange="updateSelectedNote()">
          </div>

          <div class="form-item">
            <div style="display:flex; justify-content:space-between;">
              <label>位置 X</label>
              <span id="ins-x-val" style="font-size:11px; color:var(--accent);">0</span>
            </div>
            <input type="range" id="ins-x" min="-450" max="450" value="0" oninput="updateSelectedNote()">
          </div>

          <div class="row">
            <div class="form-item">
              <label>流速倍率</label>
              <input type="number" id="ins-speed" value="1.0" step="0.1" min="0.2" max="10" onchange="updateSelectedNote()">
            </div>
            <div class="form-item">
              <label>Hold時長(ms)</label>
              <input type="number" id="ins-hold" value="600" step="50" onchange="updateSelectedNote()">
            </div>
          </div>

          <div class="row" style="margin-top: 6px;">
            <button class="btn btn-danger" onclick="deleteSelectedNote()">刪除該音符</button>
            <button class="btn btn-gray" onclick="deselectNote()">取消選中</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 匯出 -->
    <div class="bottom-status">
      <button class="btn btn-green" style="width: 100%; padding: 8px 0;" onclick="exportPackage()">
        下載 chart.json 與 info.json
      </button>
    </div>
  </div>

  <!-- 右側工作區 -->
  <div class="workspace">
    <!-- 頂部工具列 -->
    <div class="top-toolbar">
      <div class="transport">
        <button class="btn btn-blue" id="play-btn" onclick="togglePlay()">播放 / 暫停 (空格)</button>
        <button class="btn btn-gray" onclick="seekTo(0)">回起點</button>
        <div class="timer" id="time-display">00:00.000</div>
      </div>

      <div style="display:flex; align-items:center; gap:12px;">
        <div class="mode-badge" id="mode-indicator">模式: 準備就緒</div>
        <div style="font-size: 11px; color: var(--text-dim);">
          操作指南: 播放時<b>在判定線上直接點擊</b>即可錄音符，或按鍵盤 <b>D / F / J / K</b>
        </div>
      </div>
    </div>

    <!-- 主畫布 -->
    <canvas id="stage-canvas"></canvas>

    <!-- 底部時間軸 -->
    <div class="timeline-wrap" id="timeline-scroll">
      <canvas id="timeline-canvas"></canvas>
    </div>
  </div>

  <script>
    /**
     * PHIRA PRO JR - 實時錄製與細調制譜核心
     */
    const audioElem = document.getElementById('html5-audio');
    let audioDuration = 180;
    let isPlaying = false;
    let currentMs = 0;

    const stageCanvas = document.getElementById('stage-canvas');
    const stageCtx = stageCanvas.getContext('2d');
    const tlCanvas = document.getElementById('timeline-canvas');
    const tlCtx = tlCanvas.getContext('2d');

    let stageW = (stageCanvas.width = stageCanvas.clientWidth);
    let stageH = (stageCanvas.height = stageCanvas.clientHeight);

    window.addEventListener('resize', () => {
      stageW = stageCanvas.width = stageCanvas.clientWidth;
      stageH = stageCanvas.height = stageCanvas.clientHeight;
      drawTimeline();
    });

    // 譜面數據模型
    const chart = {
      offset: 0,
      lines: [
        {
          id: 0,
          name: "判定線 1",
          moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
          rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
          alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
          notes: []
        }
      ]
    };

    let activeLineIndex = 0;
    let selectedNoteRef = null; // { lineIndex, noteIndex }

    /**
     * 1. 穩定音頻載入
     */
    document.getElementById('audio-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const label = document.getElementById('audio-filename');
      label.innerText = `正在讀取: ${file.name} ...`;
      label.style.color = '#ffe57f';

      const fileUrl = URL.createObjectURL(file);
      audioElem.src = fileUrl;

      audioElem.onloadedmetadata = () => {
        audioDuration = audioElem.duration || 180;
        label.innerText = `✓ 已就緒: ${file.name} (${audioDuration.toFixed(1)}s)`;
        label.style.color = '#56d364';
        document.getElementById('audio-select-btn').innerText = '更換音頻';
        setupTimeline();
      };
      audioElem.onerror = () => {
        label.innerText = `⚠️ 播放引擎已就緒: ${file.name}`;
        label.style.color = '#56d364';
        setupTimeline();
      };
    });

    function setupTimeline() {
      tlCanvas.width = Math.max(window.innerWidth, audioDuration * 100);
      tlCanvas.height = 110;
      drawTimeline();
    }

    /**
     * 2. 播放 / 暫停驅動
     */
    function togglePlay() {
      if (isPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      if (audioElem.src) {
        audioElem.currentTime = currentMs / 1000;
        audioElem.play().catch(() => {});
      }
      isPlaying = true;
      lastTime = performance.now();
      document.getElementById('play-btn').innerText = '暫停 (空格)';
      document.getElementById('mode-indicator').innerText = '模式: 實時錄製中 (在線上敲擊)';
      document.getElementById('mode-indicator').classList.add('recording');
    }

    function pauseAudio() {
      if (audioElem.src) {
        audioElem.pause();
      }
      isPlaying = false;
      document.getElementById('play-btn').innerText = '播放 (空格)';
      document.getElementById('mode-indicator').innerText = '模式: 檢查與細調 (點選音符)';
      document.getElementById('mode-indicator').classList.remove('recording');
    }

    function seekTo(ms) {
      currentMs = Math.max(0, ms);
      if (audioElem.src) audioElem.currentTime = currentMs / 1000;
      updateTimelineScroll();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        togglePlay();
      }

      // 支援鍵盤 D / F / J / K 快速打擊錄製
      if (isPlaying && ['KeyD', 'KeyF', 'KeyJ', 'KeyK'].includes(e.code)) {
        const laneOffsets = { KeyD: -240, KeyF: -80, KeyJ: 80, KeyK: 240 };
        recordNoteAt(laneOffsets[e.code]);
      }
    });

    /**
     * 3. 核心打擊錄製邏輯 (點擊屏幕判定線或按鍵錄製)
     */
    function recordNoteAt(localX) {
      const line = chart.lines[activeLineIndex] || chart.lines[0];
      const newNote = {
        type: 'tap',
        time: Math.round(currentMs),
        posX: Math.round(localX),
        speed: 1.0,
        isAbove: true
      };

      line.notes.push(newNote);
      line.notes.sort((a, b) => a.time - b.time);

      // 選中剛敲擊下的音符，方便隨時暫停細調
      selectedNoteRef = { lineIndex: activeLineIndex, noteIndex: line.notes.indexOf(newNote) };
      syncInspectorUI();
      drawTimeline();
    }

    // 點擊畫布判定線錄製或選中音符
    stageCanvas.addEventListener('mousedown', (e) => {
      const rect = stageCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const lineY = stageH * 0.5;
      const localX = clickX - (stageW * 0.5);

      if (isPlaying) {
        // 播放中：實時錄製音符
        recordNoteAt(localX);
      } else {
        // 暫停中：點選音符進行後期細調
        checkSelectNoteAt(localX, clickY - lineY);
      }
    });

    function checkSelectNoteAt(relX, relY) {
      let found = null;

      chart.lines.forEach((line, lIdx) => {
        line.notes.forEach((note, nIdx) => {
          const dt = note.time - currentMs;
          const yOffset = dt * (note.speed * (stageH * 0.0012)) * (note.isAbove ? -1 : 1);

          // 碰撞測試 (寬度 80px, 高度 20px)
          if (Math.abs(relX - note.posX) < 45 && Math.abs(relY - yOffset) < 16) {
            found = { lineIndex: lIdx, noteIndex: nIdx };
          }
        });
      });

      selectedNoteRef = found;
      syncInspectorUI();
    }

    /**
     * 4. 後期音符屬性編輯器 (Inspector)
     */
    function syncInspectorUI() {
      const panel = document.getElementById('inspector-content');
      const status = document.getElementById('inspect-status');

      if (!selectedNoteRef) {
        panel.style.opacity = '0.4';
        panel.style.pointerEvents = 'none';
        status.innerText = '未選中音符';
        return;
      }

      const note = chart.lines[selectedNoteRef.lineIndex].notes[selectedNoteRef.noteIndex];
      if (!note) {
        selectedNoteRef = null;
        syncInspectorUI();
        return;
      }

      panel.style.opacity = '1';
      panel.style.pointerEvents = 'auto';
      status.innerText = `選中線${selectedNoteRef.lineIndex}上的音符`;

      document.getElementById('ins-type').value = note.type;
      document.getElementById('ins-time').value = note.time;
      document.getElementById('ins-x').value = note.posX;
      document.getElementById('ins-x-val').innerText = note.posX;
      document.getElementById('ins-speed').value = note.speed;
      document.getElementById('ins-hold').value = note.holdTime || 600;

      // 更新判定線選框
      const lineSelect = document.getElementById('ins-line');
      lineSelect.innerHTML = '';
      chart.lines.forEach((l, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = l.name;
        if (idx === selectedNoteRef.lineIndex) opt.selected = true;
        lineSelect.appendChild(opt);
      });
    }

    function updateSelectedNote() {
      if (!selectedNoteRef) return;
      const note = chart.lines[selectedNoteRef.lineIndex].notes[selectedNoteRef.noteIndex];
      if (!note) return;

      note.type = document.getElementById('ins-type').value;
      note.time = parseInt(document.getElementById('ins-time').value) || 0;
      note.posX = parseInt(document.getElementById('ins-x').value) || 0;
      note.speed = parseFloat(document.getElementById('ins-speed').value) || 1.0;
      if (note.type === 'hold') {
        note.holdTime = parseInt(document.getElementById('ins-hold').value) || 600;
      }

      document.getElementById('ins-x-val').innerText = note.posX;
      chart.lines[selectedNoteRef.lineIndex].notes.sort((a, b) => a.time - b.time);
      drawTimeline();
    }

    function updateSelectedNoteLine() {
      if (!selectedNoteRef) return;
      const targetLineIdx = parseInt(document.getElementById('ins-line').value);
      if (targetLineIdx === selectedNoteRef.lineIndex) return;

      const note = chart.lines[selectedNoteRef.lineIndex].notes.splice(selectedNoteRef.noteIndex, 1)[0];
      chart.lines[targetLineIdx].notes.push(note);
      chart.lines[targetLineIdx].notes.sort((a, b) => a.time - b.time);

      selectedNoteRef = {
        lineIndex: targetLineIdx,
        noteIndex: chart.lines[targetLineIdx].notes.indexOf(note)
      };
      syncInspectorUI();
      drawTimeline();
    }

    function deleteSelectedNote() {
      if (!selectedNoteRef) return;
      chart.lines[selectedNoteRef.lineIndex].notes.splice(selectedNoteRef.noteIndex, 1);
      selectedNoteRef = null;
      syncInspectorUI();
      drawTimeline();
    }

    function deselectNote() {
      selectedNoteRef = null;
      syncInspectorUI();
    }

    /**
     * 5. 判定線管理
     */
    function renderLineList() {
      const container = document.getElementById('line-list-container');
      container.innerHTML = '';
      document.getElementById('line-count').innerText = chart.lines.length;

      chart.lines.forEach((line, idx) => {
        const item = document.createElement('div');
        item.className = `line-item ${idx === activeLineIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span>${line.name} (${line.notes.length} 音符)</span>
          ${chart.lines.length > 1 ? `<span style="color:#ff7b72;cursor:pointer;" onclick="deleteLine(event, ${idx})">刪除</span>` : ''}
        `;
        item.addEventListener('click', () => {
          activeLineIndex = idx;
          renderLineList();
        });
        container.appendChild(item);
      });
    }

    function addNewLine() {
      const newId = chart.lines.length;
      chart.lines.push({
        id: newId,
        name: `判定線 ${newId + 1}`,
        moveEvents: [{ startTime: 0, endTime: 1000, startX: 0.5, startY: 0.5, endX: 0.5, endY: 0.5 }],
        rotateEvents: [{ startTime: 0, endTime: 1000, startAngle: 0, endAngle: 0 }],
        alphaEvents: [{ startTime: 0, endTime: 500, startAlpha: 0, endAlpha: 1 }],
        notes: []
      });
      activeLineIndex = newId;
      renderLineList();
      drawTimeline();
    }

    function deleteLine(e, idx) {
      e.stopPropagation();
      if (chart.lines.length <= 1) return;
      chart.lines.splice(idx, 1);
      if (activeLineIndex >= chart.lines.length) activeLineIndex = chart.lines.length - 1;
      selectedNoteRef = null;
      syncInspectorUI();
      renderLineList();
      drawTimeline();
    }

    /**
     * 6. 核心繪製迴圈
     */
    let lastTime = performance.now();

    function renderLoop(now) {
      const delta = now - lastTime;
      lastTime = now;

      if (isPlaying) {
        if (audioElem.src && !audioElem.paused) {
          currentMs = audioElem.currentTime * 1000;
        } else {
          currentMs += delta;
        }
        updateTimelineScroll();
      }

      // 時間碼展示
      const totalSec = Math.floor(currentMs / 1000);
      const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
      const s = (totalSec % 60).toString().padStart(2, '0');
      const ms = Math.floor(currentMs % 1000).toString().padStart(3, '0');
      document.getElementById('time-display').innerText = `${m}:${s}.${ms}`;

      stageCtx.clearRect(0, 0, stageW, stageH);

      const lineY = stageH * 0.5;

      // 繪製判定線與音符
      chart.lines.forEach((line, idx) => {
        const isActive = (idx === activeLineIndex);

        stageCtx.save();
        stageCtx.translate(stageW * 0.5, lineY);

        // 判定線主體
        stageCtx.strokeStyle = isActive ? '#ffffff' : 'rgba(255, 255, 255, 0.3)';
        stageCtx.lineWidth = isActive ? 3.5 : 2;
        stageCtx.beginPath();
        stageCtx.moveTo(-stageW, 0);
        stageCtx.lineTo(stageW, 0);
        stageCtx.stroke();

        stageCtx.font = '11px sans-serif';
        stageCtx.fillStyle = isActive ? '#58a6ff' : 'rgba(255, 255, 255, 0.35)';
        stageCtx.fillText(line.name, -stageW * 0.46, -10);

        // 繪製線上音符
        line.notes.forEach((note, nIdx) => {
          const dt = note.time - currentMs;
          const side = note.isAbove ? -1 : 1;
          const yOffset = dt * (note.speed * (stageH * 0.0012)) * side;

          const isSelected = selectedNoteRef && selectedNoteRef.lineIndex === idx && selectedNoteRef.noteIndex === nIdx;

          if (Math.abs(yOffset) < stageH * 1.5) {
            drawNote(stageCtx, note.posX, yOffset, note, side, isSelected);
          }
        });

        stageCtx.restore();
      });

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function drawNote(ctx, x, y, note, side, isSelected) {
      const nw = 68;
      const nh = 8;
      ctx.save();
      ctx.translate(x, y);

      if (isSelected) {
        // 選中高亮外邊框
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(-nw / 2 - 4, -nh / 2 - 4, nw + 8, nh + 8);
      }

      switch (note.type) {
        case 'tap':
          ctx.fillStyle = '#79c0ff';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          ctx.strokeStyle = '#e6f1ff';
          ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'drag':
          ctx.fillStyle = '#ffe57f';
          ctx.beginPath();
          ctx.moveTo(0, -nh * 1.3);
          ctx.lineTo(nw * 0.3, 0);
          ctx.lineTo(0, nh * 1.3);
          ctx.lineTo(-nw * 0.3, 0);
          ctx.closePath();
          ctx.fill();
          break;
        case 'hold':
          const holdLen = (note.holdTime * note.speed * (stageH * 0.0012)) * -side;
          ctx.fillStyle = 'rgba(86, 211, 100, 0.45)';
          ctx.fillRect(-nw / 2, 0, nw, holdLen);
          ctx.fillStyle = '#56d364';
          ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
          break;
        case 'flick':
          ctx.fillStyle = '#ff7b72';
          ctx.beginPath();
          ctx.moveTo(-nw / 2, nh);
          ctx.lineTo(0, -nh);
          ctx.lineTo(nw / 2, nh);
          ctx.closePath();
          ctx.fill();
          break;
      }
      ctx.restore();
    }

    /**
     * 7. 時間軸與點擊尋道
     */
    function drawTimeline() {
      if (!tlCanvas.width) return;
      tlCtx.clearRect(0, 0, tlCanvas.width, tlCanvas.height);

      const bpm = parseFloat(document.getElementById('meta-bpm').value) || 120;
      const beatPx = (60 / bpm) * 100;

      tlCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      for (let x = 0; x < tlCanvas.width; x += beatPx) {
        tlCtx.beginPath();
        tlCtx.moveTo(x, 0);
        tlCtx.lineTo(x, tlCanvas.height);
        tlCtx.stroke();
      }

      chart.lines.forEach((line, lIdx) => {
        line.notes.forEach(note => {
          const x = (note.time / 1000) * 100;
          let color = '#79c0ff';
          if (note.type === 'drag') color = '#ffe57f';
          if (note.type === 'hold') color = '#56d364';
          if (note.type === 'flick') color = '#ff7b72';

          tlCtx.fillStyle = color;
          tlCtx.fillRect(x - 2, 20, 4, tlCanvas.height - 40);
        });
      });
    }

    function updateTimelineScroll() {
      const scrollPos = (currentMs / 1000) * 100 - (window.innerWidth / 2);
      document.getElementById('timeline-scroll').scrollLeft = Math.max(0, scrollPos);
    }

    tlCanvas.addEventListener('click', (e) => {
      const rect = tlCanvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      seekTo((clickX / 100) * 1000);
    });

    /**
     * 8. 一鍵導出
     */
    function exportPackage() {
      chart.lines.forEach(l => l.notes.sort((a, b) => a.time - b.time));

      const chartData = JSON.stringify(chart, null, 2);
      const infoData = JSON.stringify({
        title: document.getElementById('meta-title').value,
        artist: "JR Custom",
        bpm: parseFloat(document.getElementById('meta-bpm').value),
        difficulty: "IN Lv.12",
        chart: "chart.json",
        audio: "audio.mp3",
        bg: "bg.jpg"
      }, null, 2);

      download(chartData, 'chart.json', 'application/json');
      setTimeout(() => download(infoData, 'info.json', 'application/json'), 300);
    }

    function download(content, filename, type) {
      const blob = new Blob([content], { type: type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // 初始化
    renderLineList();
    setupTimeline();
  </script>
</body>
</html>
